<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fff;--g50:#f7f7f7;--g400:#a0a0a0;--pink:#2BB5C8;--purple:#2BB5C8;--fd:'Montserrat',sans-serif;--fb:'Noto Sans JP','Montserrat',sans-serif}
html,body{min-height:100vh;font-family:var(--fb);background:var(--black);color:var(--white);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
a{text-decoration:none;color:inherit}
.wrap{width:100%;max-width:400px;padding:24px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:32px;margin-bottom:16px}
.ttl{font-family:var(--fd);font-size:18px;font-weight:400;letter-spacing:-.02em;margin-bottom:6px;color:var(--white)}
.sub{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:24px;line-height:1.7}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.fin{font-family:var(--fb);font-size:13px;padding:11px 14px;border:1px solid rgba(255,255,255,.12);border-radius:8px;outline:none;transition:border-color .15s;width:100%;background:rgba(255,255,255,.06);color:var(--white)}
.fin:focus{border-color:var(--purple)}
.fin::placeholder{color:rgba(255,255,255,.2)}
.btn{width:100%;font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.08em;padding:13px;background:linear-gradient(135deg,#79F1A4,#2BB5C8);color:#fff;border:none;border-radius:8px;cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{font-size:11px;color:#fca5a5;background:rgba(239,68,68,.15);border-radius:6px;padding:10px 12px;margin-bottom:16px;display:none}
.err.show{display:block}
.info{font-size:11px;color:rgba(255,255,255,.4);background:rgba(255,255,255,.05);border-radius:6px;padding:10px 12px;margin-bottom:16px;display:none}
.info.show{display:block}
.back{font-size:11px;color:rgba(255,255,255,.25);text-align:center}
.back a{color:rgba(255,255,255,.4)}
.back a:hover{color:var(--white)}
.forgot{font-size:11px;color:rgba(255,255,255,.3);text-align:right;margin-top:-8px;margin-bottom:16px;cursor:pointer}
.forgot:hover{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;margin-bottom:32px">
    <a href="coworkmill.html">
      <img src="coworkmill_logo2.svg" alt="COWORKMILL" style="height:28px;width:auto">
    </a>
  </div>

  <div class="card">
    <div class="ttl">掲載者ログイン</div>
    <div class="sub">施設の管理画面にアクセスするにはログインしてください。</div>

    <div class="err" id="err"></div>
    <div class="info" id="info"></div>

    <div class="fg">
      <label class="fl">メールアドレス</label>
      <input class="fin" id="email" type="email" placeholder="info@example.com" autocomplete="email">
    </div>
    <div class="fg">
      <label class="fl">パスワード</label>
      <input class="fin" id="pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="forgot" onclick="resetPassword()">パスワードをお忘れの方</div>

    <button class="btn" id="loginBtn" onclick="login()">ログイン</button>
  </div>

  <div class="back">施設掲載のご申請は<a href="coworkmill-register.html">こちら</a></div>
</div>

<script>
const SUPABASE_URL = 'https://jakwntemjkwqwaqujffh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// すでにログイン済みなら管理画面へ
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) location.href = 'coworkmill-admin-view.html';
})();

async function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  const errEl = document.getElementById('err');
  const btn = document.getElementById('loginBtn');

  errEl.classList.remove('show');

  if (!email || !pass) {
    errEl.textContent = 'メールアドレスとパスワードを入力してください。';
    errEl.classList.add('show');
    return;
  }

  btn.textContent = 'ログイン中...';
  btn.disabled = true;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password: pass
  });

  if (error) {
    if (error.message.includes('Email not confirmed')) {
      errEl.textContent = 'メールアドレスの確認が完了していません。招待メールのリンクをクリックしてください。';
    } else {
      errEl.textContent = 'メールアドレスまたはパスワードが正しくありません。';
    }
    errEl.classList.add('show');
    btn.textContent = 'ログイン';
    btn.disabled = false;
    return;
  }

  location.href = 'coworkmill-admin-view.html';
}

async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('err');
  const infoEl = document.getElementById('info');

  errEl.classList.remove('show');
  infoEl.classList.remove('show');

  if (!email) {
    errEl.textContent = 'メールアドレスを入力してからクリックしてください。';
    errEl.classList.add('show');
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + '/coworkmill-admin-view.html'
  });

  if (error) {
    errEl.textContent = 'パスワードリセットメールの送信に失敗しました。';
    errEl.classList.add('show');
  } else {
    infoEl.textContent = `${email} にパスワードリセットメールを送信しました。`;
    infoEl.classList.add('show');
  }
}
</script>
</body>
</html>
