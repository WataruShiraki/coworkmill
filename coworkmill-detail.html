<!DOCTYPE html>
<html><head><style>
/* ===== Airbnbスタイルギャラリー ===== */
.gallery-pc{height:480px!important;overflow:hidden!important;border-radius:8px!important;position:relative!important;grid-template-columns:2fr 1fr 1fr!important;grid-template-rows:1fr 1fr!important}
.gallery-pc[data-layout="1"]{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
.gallery-pc[data-layout="2"]{grid-template-columns:1fr 1fr!important;grid-template-rows:1fr!important}
.gallery-pc[data-layout="3"]{grid-template-columns:2fr 1fr!important;grid-template-rows:1fr 1fr!important}
.gallery-pc[data-layout="3"] .gpc-item:first-child{grid-row:span 2!important}
.gallery-pc[data-layout="5"]{grid-template-columns:2fr 1fr 1fr!important;grid-template-rows:1fr 1fr!important}
.gallery-pc[data-layout="5"] .gpc-item:first-child{grid-row:span 2!important}
.gpc-item{aspect-ratio:unset!important;min-height:0!important;cursor:pointer!important;background:#111!important}
.gpc-item img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}
#cwm-all-btn{position:absolute!important;bottom:14px!important;right:14px!important;background:rgba(255,255,255,.92)!important;color:#111!important;border:1.5px solid #ccc!important;border-radius:8px!important;padding:8px 16px!important;font-size:12px!important;font-weight:600!important;font-family:sans-serif!important;cursor:pointer!important;z-index:10!important}
#cwm-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;align-items:center;justify-content:center}
#cwm-lb.open{display:flex!important}
#cwm-lb-img{max-width:88vw;max-height:85vh;object-fit:contain;border-radius:4px}
#cwm-lb-x{position:fixed;top:20px;right:24px;color:#fff;font-size:38px;cursor:pointer;line-height:1;z-index:10000;background:none;border:none;opacity:.8}
#cwm-lb-p,#cwm-lb-n{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;font-size:36px;border:none;width:60px;height:60px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10000;transition:background .2s}
#cwm-lb-p{left:16px}#cwm-lb-n{right:16px}
#cwm-lb-p:hover,#cwm-lb-n:hover{background:rgba(255,255,255,.3)}
#cwm-lb-c{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;font-family:sans-serif}

/* ===== 施設名を大きく ===== */
.detail-space-title {
  font-size: 28px !important;
  font-weight: 600 !important;
  letter-spacing: -0.02em !important;
  line-height: 1.2 !important;
  margin-bottom: 16px !important;
  color: var(--white, #fff) !important;
}
  </style></head><body>undefined<script>(function(){
/* ===== ギャラリー ===== */
var lbImgs=[],lbIdx=0;
function openLb(imgs,i){lbImgs=imgs;lbIdx=i;updLb();document.getElementById('cwm-lb').classList.add('open');document.body.style.overflow='hidden';}
function closeLb(){document.getElementById('cwm-lb').classList.remove('open');document.body.style.overflow='';}
function updLb(){document.getElementById('cwm-lb-img').src=lbImgs[lbIdx];document.getElementById('cwm-lb-c').textContent=(lbIdx+1)+' / '+lbImgs.length;}
function initLb(){
  if(document.getElementById('cwm-lb'))return;
  var lb=document.createElement('div');lb.id='cwm-lb';
  lb.innerHTML='<button id="cwm-lb-x">&#215;</button><button id="cwm-lb-p">&#8249;</button><img id="cwm-lb-img" src="" alt=""><button id="cwm-lb-n">&#8250;</button><div id="cwm-lb-c"></div>';
  document.body.appendChild(lb);
  document.getElementById('cwm-lb-x').onclick=closeLb;
  lb.onclick=function(e){if(e.target===lb)closeLb();};
  document.getElementById('cwm-lb-p').onclick=function(e){e.stopPropagation();lbIdx=(lbIdx-1+lbImgs.length)%lbImgs.length;updLb();};
  document.getElementById('cwm-lb-n').onclick=function(e){e.stopPropagation();lbIdx=(lbIdx+1)%lbImgs.length;updLb();};
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('cwm-lb').classList.contains('open'))return;
    if(e.key==='ArrowRight'){lbIdx=(lbIdx+1)%lbImgs.length;updLb();}
    if(e.key==='ArrowLeft'){lbIdx=(lbIdx-1+lbImgs.length)%lbImgs.length;updLb();}
    if(e.key==='Escape')closeLb();
  });
}
function initGallery(){
  var pc=document.querySelector('.gallery-pc');
  if(!pc)return;
  var items=Array.from(pc.querySelectorAll('.gpc-item'));
  var total=items.length;
  if(!total)return;
  var photos=items.map(function(el){var img=el.querySelector('img');return img&&img.src;}).filter(Boolean);
  var show=Math.min(total,5);
  var layout=show<=1?1:show<=2?2:show<=3?3:5;
  pc.setAttribute('data-layout',layout);
  items.forEach(function(item,i){
    item.style.display=i<show?'':'none';
    if(i<show){item.onclick=function(){initLb();openLb(photos,i);};}
  });
  var btn=document.getElementById('cwm-all-btn');
  if(!btn){btn=document.createElement('button');btn.id='cwm-all-btn';pc.appendChild(btn);}
  btn.textContent='写真を見る（'+total+'枚）';
  btn.onclick=function(e){e.stopPropagation();initLb();openLb(photos,0);};
}
var obs=new MutationObserver(initGallery);
function startGallery(){var pc=document.querySelector('.gallery-pc');if(pc){obs.observe(pc,{childList:true});initGallery();}else{setTimeout(startGallery,300);}}

/* ===== 施設名を説明文の上に移動 ===== */
function moveName(){
  var mainTop = document.querySelector('.detail-main > div:first-child');
  if(!mainTop) return;
  var children = Array.from(mainTop.children);
  // 施設名：space-eyebrowの次の無名div
  var eyebrow = mainTop.querySelector('.space-eyebrow');
  var nameEl = eyebrow ? eyebrow.nextElementSibling : null;
  var descEl = mainTop.querySelector('p.space-desc, .space-desc');
  if(!nameEl || !descEl) return;
  // すでに移動済みならスキップ
  if(nameEl.classList.contains('detail-space-title')) return;
  // classを付与してスタイル適用
  nameEl.classList.add('detail-space-title');
  // 説明文の直前に移動
  descEl.parentNode.insertBefore(nameEl, descEl);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',function(){startGallery();moveName();});
}else{startGallery();moveName();}
})();</script></body></html>
