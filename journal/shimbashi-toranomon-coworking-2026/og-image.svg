    <circle cx="150" cy="85" r="1.4"/>
    <circle cx="230" cy="40" r="0.9"/>
    <circle cx="320" cy="70" r="1.1"/>
    <circle cx="420" cy="35" r="1.3"/>
    <circle cx="520" cy="80" r="0.9"/>
    <circle cx="610" cy="50" r="1.1"/>
    <circle cx="710" cy="100" r="1"/>
    <circle cx="820" cy="40" r="1.4"/>
    <circle cx="920" cy="75" r="1"/>
