function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function getSlug() {
  const params = new URLSearchParams(location.search);
  const fromQuery = params.get('slug');
  if (fromQuery) return fromQuery;
  const m = location.pathname.match(/^\/journal\/([a-z0-9-]+)\/?$/);
  if (m && m[1] !== 'index' && m[1] !== 'article') return m[1];
  return '';
}

// YouTube URL を含む段落を responsive iframe に変換
function transformBodyHtml(html) {
  if (!html) return '';
  // <p>https://www.youtube.com/watch?v=ID...</p> や <p>https://youtu.be/ID</p>
  // marked.js は autolink でアンカー化することもあるため両パターンを処理
  const ytRe = /<p>\s*(?:<a [^>]*>)?(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?[^<\s]*?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/|youtube\.com\/live\/)([\w-]{11})[^<]*(?:<\/a>)?\s*<\/p>/gi;
  return html.replace(ytRe, function(_, id){
    return '<div class="j-youtube"><iframe src="https://www.youtube.com/embed/' + id + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>';
  });
}

// body_html が無い旧記事のための簡易 markdown レンダラ (画像と見出しと段落)
function renderMarkdownFallback(md) {
  if (!md) return '';
  return md.split(/\n\n+/).map(function(block) {
    const trimmed = block.trim();
    if (!trimmed) return '';
    // 見出し
    const hMatch = trimmed.match(/^(#{2,3})\s+(.+)$/);
    if (hMatch) {
      const tag = hMatch[1].length === 2 ? 'h2' : 'h3';
      return '<' + tag + '>' + escapeHtml(hMatch[2]) + '</' + tag + '>';
    }
    // 単独画像 ![alt](url)
    const imgOnly = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (imgOnly) {
      return '<p><img src="' + escapeAttr(imgOnly[2]) + '" alt="' + escapeAttr(imgOnly[1]) + '"></p>';
    }
    // 段落 (インラインの ![alt](url) と [text](url) を変換)
    let p = escapeHtml(trimmed)
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, url){
        return '<img src="' + escapeAttr(url) + '" alt="' + escapeAttr(alt) + '">';
      })
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url){
        return '<a href="' + escapeAttr(url) + '">' + text + '</a>';
      });
    return '<p>' + p + '</p>';
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

      const raw = localStorage.getItem('cwm_journal_preview');
      if (!raw) {
        document.getElementById('main').innerHTML = '<div class="j-back-wrap"><a class="j-back" href="/journal/">← 一覧に戻る</a></div><div class="j-empty">プレビューデータが見つかりません。<br>journal 管理画面の「プレビュー」ボタンから開いてください。</div>';
        return;
      }
      const a = JSON.parse(raw);
      // 1度読んだら削除(プレビューの古いデータ残留防止)
      try { localStorage.removeItem('cwm_journal_preview'); } catch(e) {}
      // 検索エンジンに拾わせない
      const robotsMeta = document.querySelector('meta[name="robots"]');
      if (robotsMeta) robotsMeta.setAttribute('content','noindex,nofollow');
      // プレビューバナー
      const banner = document.createElement('div');
      banner.style.cssText = 'position:sticky;top:0;z-index:1000;background:#f59e0b;color:#fff;text-align:center;padding:8px 16px;font-size:13px;font-weight:500;letter-spacing:.04em';
      banner.textContent = '📝 下書きプレビュー — このページは公開されていません(タブを閉じるとプレビューデータは消えます)';
      document.body.insertBefore(banner, document.body.firstChild);
      renderArticle(a);
      // 関連記事/メディアは preview モードでは取得しない(認証なくても draft の関連は取れない)
      return;
    } catch(e) {
      console.error('preview load error:', e);
      document.getElementById('main').innerHTML = '<div class="j-back-wrap"><a class="j-back" href="/journal/">← 一覧に戻る</a></div><div class="j-empty">プレビューの読み込みに失敗しました。</div>';
      return;
    }
  }
  if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
    document.getElementById('main').innerHTML = '<div class="j-status">記事が見つかりません<br><br><a href="/journal/">← journal トップに戻る</a></div>';
    return;
  }
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/articles?select=*&slug=eq.' + encodeURIComponent(slug) + (isPreview ? '&limit=1' : '&status=eq.live&limit=1'), {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (isPreview && previewToken ? previewToken : SUPABASE_KEY) }
    });
    const data = await res.json();
    if (!Array.isArray(data) || !data[0]) {
      document.getElementById('main').innerHTML = '<div class="j-status">記事が見つかりません<br><br><a href="/journal/">← journal トップに戻る</a></div>';
      return;
    }
    renderArticle(data[0]);
    loadMedia(data[0].id);
    loadRelated(data[0].category, data[0].id);
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="j-status">記事の読み込みに失敗しました</div>';
  }
}

function renderArticle(a) {
  document.title = a.meta_title || (a.title + ' — COWORKMILL journal');
  document.getElementById('meta-desc').content = a.meta_description || a.excerpt || '';
  document.getElementById('og-title').content = a.title;
  document.getElementById('og-desc').content = a.excerpt || '';
  document.getElementById('og-img').content = a.og_image || a.hero_image || '';
  document.getElementById('og-url').content = location.href;
  // canonical も /journal/[slug]/ の正規 URL に
  const canonicalEl = document.getElementById('canonical-link');
  if (canonicalEl) {
    canonicalEl.href = 'https://coworkmill.vercel.app/journal/' + encodeURIComponent(a.slug);
  }
  // article specific meta
  const articleMeta = document.createElement('meta');
  articleMeta.setAttribute('property', 'article:published_time');
  articleMeta.setAttribute('content', a.published_at || '');
  document.head.appendChild(articleMeta);
  if (a.author_name) {
    const authorMeta = document.createElement('meta');
    authorMeta.setAttribute('name', 'author');
    authorMeta.setAttribute('content', a.author_name);
    document.head.appendChild(authorMeta);
  }
  if (a.tags && Array.isArray(a.tags)) {
    a.tags.forEach(t => {
      const tagMeta = document.createElement('meta');
      tagMeta.setAttribute('property', 'article:tag');
      tagMeta.setAttribute('content', String(t));
      document.head.appendChild(tagMeta);
    });
  }
  
  const ld = {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": a.title,
    "description": a.excerpt,
    "image": a.hero_image,
    "datePublished": a.published_at,
    "dateModified": a.updated_at,
    "author": { "@type": "Person", "name": a.author_name }
  };
  const ldEl = document.createElement('script');
  ldEl.type = 'application/ld+json';
  ldEl.textContent = JSON.stringify(ld);
  document.head.appendChild(ldEl);
  
  const main = document.getElementById('main');
  main.innerHTML = '';
  
  const article = document.createElement('article');
  article.className = 'j-article';
  
  const back = document.createElement('a');
  back.className = 'j-back';
  back.href = '/journal/';
  back.textContent = '← journal';
  article.appendChild(back);
  
  const cat = document.createElement('div');
  cat.className = 'j-cat-line';
  cat.textContent = CATEGORY_LABELS[a.category] || a.category;
  article.appendChild(cat);
  
  const title = document.createElement('h1');
  title.className = 'j-title';
  title.textContent = a.title;
  article.appendChild(title);
  
  if (a.subtitle) {
    const sub = document.createElement('p');
    sub.className = 'j-subtitle';
    sub.textContent = a.subtitle;
    article.appendChild(sub);
  }
  
  const meta = document.createElement('div');
  meta.className = 'j-meta';
  const author = document.createElement('span');
  author.className = 'j-author';
  author.textContent = a.author_name;
  meta.appendChild(author);
  meta.appendChild(document.createTextNode(formatDate(a.published_at)));
  if (a.reading_minutes) meta.appendChild(document.createTextNode('読了 ' + a.reading_minutes + '分'));
  if (a.is_pr) {
    const pr = document.createElement('span');
    pr.className = 'j-pr';
    pr.textContent = 'PR';
    meta.appendChild(pr);
  }
  article.appendChild(meta);
  
  if (a.is_pr && a.pr_disclosure) {
    const disc = document.createElement('div');
    disc.className = 'j-pr-disclosure';
    disc.textContent = a.pr_disclosure;
    article.appendChild(disc);
  }
  
  if (a.hero_image && cwm && cwm.safeUrl) {
    const heroDiv = document.createElement('div');
    heroDiv.className = 'j-hero';
    const img = document.createElement('img');
    img.src = cwm.safeUrl(a.hero_image);
    img.alt = a.title;
    heroDiv.appendChild(img);
    article.appendChild(heroDiv);
  }
  
  const body = document.createElement('div');
  body.className = 'j-body';
  if (a.body_html) {
    body.innerHTML = transformBodyHtml(a.body_html);
  } else if (a.body_md) {
    body.innerHTML = transformBodyHtml(renderMarkdownFallback(a.body_md));
  }
  article.appendChild(body);
  
  if (a.tags && Array.isArray(a.tags) && a.tags.length) {
    const tags = document.createElement('div');
    tags.className = 'j-tags';
    a.tags.forEach(t => {
      const tag = document.createElement('span');
      tag.className = 'j-tag';
      tag.textContent = '#' + t;
      tags.appendChild(tag);
    });
    article.appendChild(tags);
  }
  
  const authorBox = document.createElement('div');
  authorBox.className = 'j-author-box';
  const avatar = document.createElement('div');
  avatar.className = 'j-author-avatar';
  if (a.author_avatar && cwm && cwm.safeUrl) {
    avatar.style.backgroundImage = "url('" + cwm.safeUrl(a.author_avatar) + "')";
  }
  authorBox.appendChild(avatar);
  const info = document.createElement('div');
  info.className = 'j-author-info';
  const name = document.createElement('div');
  name.className = 'j-author-name';
  name.textContent = a.author_name;
  info.appendChild(name);
  if (a.author_bio) {
    const bio = document.createElement('div');
    bio.className = 'j-author-bio';
    bio.textContent = a.author_bio;
    info.appendChild(bio);
  }
  authorBox.appendChild(info);
  article.appendChild(authorBox);
  
  const credits = document.createElement('div');
  credits.className = 'j-credits';
  credits.id = 'credits-box';
  credits.style.display = 'none';
  article.appendChild(credits);
  
  main.appendChild(article);
}

async function loadMedia(articleId) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/media_assets?article_id=eq.' + articleId + '&select=alt_text,source_type,photographer,source_name,source_url,license', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (isPreview && previewToken ? previewToken : SUPABASE_KEY) }
    });
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return;
    
    const box = document.getElementById('credits-box');
    if (!box) return;
    box.style.display = 'block';
    box.innerHTML = '';
    const h = document.createElement('div');
    h.className = 'j-credits-h';
    h.textContent = '画像クレジット';
    box.appendChild(h);
    
    data.forEach(m => {
      const line = document.createElement('div');
      let txt = '・' + (m.alt_text || '画像') + ': ';
      if (m.source_type === 'own') txt += '撮影/' + (m.photographer || 'COWORKMILL journal 編集部');
      else if (m.source_type === 'facility') txt += '写真提供/' + (m.source_name || '施設');
      else if (m.source_type === 'stock') txt += (m.source_name || 'Stock') + (m.photographer ? ' / ' + m.photographer : '');
      else if (m.source_type === 'ai') txt += 'AI生成画像';
      else if (m.source_type === 'cc') txt += 'CC: ' + (m.source_name || '');
      if (m.license) txt += ' (' + m.license + ')';
      line.textContent = txt;
      box.appendChild(line);
    });
  } catch (e) {}
}

async function loadRelated(category, excludeId) {
  if (!category) return;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/articles?select=slug,title,category,hero_image&category=eq.' + category + '&status=eq.live&id=neq.' + excludeId + '&order=published_at.desc&limit=3', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (isPreview && previewToken ? previewToken : SUPABASE_KEY) }
    });
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return;
    
    const sec = document.getElementById('related-sec');
    const grid = document.getElementById('related-grid');
    grid.innerHTML = '';
    data.forEach(a => {
      const card = document.createElement('a');
      card.className = 'j-r-card';
      card.href = '/journal/' + encodeURIComponent(a.slug);
      const img = document.createElement('div');
      img.className = 'j-r-img';
      if (a.hero_image && cwm && cwm.safeUrl) {
        img.style.backgroundImage = "url('" + cwm.safeUrl(a.hero_image) + "')";
      }
      card.appendChild(img);
      const c = document.createElement('div');
      c.className = 'j-r-cat';
      c.textContent = CATEGORY_LABELS[a.category] || a.category;
      card.appendChild(c);
      const t = document.createElement('div');
      t.className = 'j-r-title';
      t.textContent = a.title;
      card.appendChild(t);
      grid.appendChild(card);
    });
    sec.style.display = 'block';
  } catch (e) {}
}

(function(){
  const SB_URL = (typeof SUPABASE_URL !== 'undefined') ? SUPABASE_URL : 'https://jakwntemjkwqwaqujffh.supabase.co';
  const SB_KEY = (typeof SUPABASE_KEY !== 'undefined') ? SUPABASE_KEY : 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';
  const CAT = (typeof CATEGORY_LABELS !== 'undefined') ? CATEGORY_LABELS : {};

  const sidebarHTML = [
    '<div class="j-side-block" id="aside-rank-block" style="display:none">',
      '<h4 class="j-side-h">Most Read</h4>',
      '<ol class="j-rank-list" id="aside-rank-list"></ol>',
    '</div>',
    '<a class="j-side-cta" href="/coworkmill-spaces.html">',

    '</div>',
    '<div class="j-side-block">',
      '<h4 class="j-side-h">From COWORKMILL</h4>',
      '<div class="j-banner-list" id="aside-banners"></div>',
    '</div>',
    '<div class="j-side-block">',
      '<h4 class="j-side-h">Share</h4>',
      '<div class="j-share">',
        '<a id="aside-share-x" target="_blank" rel="noopener">X</a>',
        '<a id="aside-share-fb" target="_blank" rel="noopener">Facebook</a>',
        '<a id="aside-share-copy" href="#">Copy</a>',
      '</div>',
    '</div>'
  ].join('');

  function wrapWithSidebar(article){
    if (article.parentElement && article.parentElement.classList.contains('j-shell')) return false;
    const main = document.getElementById('main');
    if (!main) return false;
    const shell = document.createElement('div');
    shell.className = 'j-shell';
    const aside = document.createElement('aside');
    aside.className = 'j-aside';
    aside.innerHTML = sidebarHTML;
    main.removeChild(article);
    shell.appendChild(article);
    shell.appendChild(aside);
    main.appendChild(shell);
    return true;
  }

  async function bumpViewCount(slug){
    if (!slug) return;
    try {
      await fetch(SB_URL + '/rest/v1/rpc/bump_article_view', {
        method: 'POST',
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'},
        body: JSON.stringify({p_slug: slug})
      });
    } catch(e){}
  }

  async function loadRanking(currentSlug){
    try {
      const r = await fetch(SB_URL + '/rest/v1/articles?select=slug,title,hero_image,category,view_count&status=eq.live&order=view_count.desc&limit=6', {
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
      });
      const data = await r.json();
      const items = (Array.isArray(data) ? data : []).filter(a => a.slug !== currentSlug).slice(0, 5);
      if (!items.length) return;
      const list = document.getElementById('aside-rank-list');
      if (!list) return;
      list.innerHTML = '';
      items.forEach((a, i) => {
        const item = document.createElement('a');
        item.className = 'j-rank-item';
        item.href = '/journal/' + encodeURIComponent(a.slug);
        const num = document.createElement('div');
        num.className = 'j-rank-num';
        num.textContent = String(i + 1).padStart(2, '0');
        const thumb = document.createElement('div');
        thumb.className = 'j-rank-thumb';
        if (a.hero_image) thumb.style.backgroundImage = "url('" + a.hero_image.replace(/'/g, "%27") + "')";
        const meta = document.createElement('div');
        meta.className = 'j-rank-meta';
        const cat = document.createElement('div');
        cat.className = 'j-rank-cat';
        cat.textContent = CAT[a.category] || a.category || '';
        const title = document.createElement('div');
        title.className = 'j-rank-title';
        title.textContent = a.title;
        meta.appendChild(cat); meta.appendChild(title);
        item.appendChild(num); item.appendChild(thumb); item.appendChild(meta);
        list.appendChild(item);
      });
      document.getElementById('aside-rank-block').style.display = '';
    } catch(e){ console.warn('ranking failed', e); }
  }

  async function loadPicks(){
    try {
      const r = await fetch(SB_URL + '/rest/v1/spaces?select=id,name,area,prefecture,image_main&status=eq.live&plan=eq.pro&order=created_at.desc&limit=3', {
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
      });
      const data = await r.json();
      const arr = Array.isArray(data) ? data : [];
      if (!arr.length) return;
      const list = document.getElementById('aside-picks-list');
      if (!list) return;
      list.innerHTML = '';
      arr.forEach((s, idx) => {
        const card = document.createElement('a');
        card.className = 'j-pick-card';
        card.href = '/coworkmill-detail.html?id=' + encodeURIComponent(s.id);
        const thumb = document.createElement('div');
        thumb.className = 'j-pick-thumb';
        if (s.image_main) thumb.style.backgroundImage = "url('" + s.image_main.replace(/'/g, "%27") + "')";
        const meta = document.createElement('div');
        meta.className = 'j-pick-meta';
        const badge = document.createElement('div');
        badge.className = 'j-pick-badge';
        badge.textContent = '★ PICK';
        meta.appendChild(badge);
        const name = document.createElement('div');
        name.className = 'j-pick-name';
        name.textContent = s.name;
        const area = document.createElement('div');
        area.className = 'j-pick-area';
        area.textContent = [s.prefecture, s.area].filter(Boolean).join(' · ');
        meta.appendChild(name); meta.appendChild(area);
        card.appendChild(thumb); card.appendChild(meta);
        list.appendChild(card);
      });
      document.getElementById('aside-picks-block').style.display = '';
    } catch(e){ console.warn('picks failed', e); }
  }

  async function loadSidebarRelated(currentSlug, category){
    try {
      const params = ['select=slug,title,hero_image,category', 'status=eq.live', 'slug=neq.' + encodeURIComponent(currentSlug || ''), 'order=published_at.desc.nullslast', 'limit=4'];
      if (category) params.splice(2, 0, 'category=eq.' + encodeURIComponent(category));
      const r = await fetch(SB_URL + '/rest/v1/articles?' + params.join('&'), {
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
      });
      const data = await r.json();
      let items = Array.isArray(data) ? data : [];
      // fallback: if same-category has none, fetch any live articles
      if (!items.length && category){
        const r2 = await fetch(SB_URL + '/rest/v1/articles?select=slug,title,hero_image,category&status=eq.live&slug=neq.' + encodeURIComponent(currentSlug || '') + '&order=published_at.desc.nullslast&limit=3', {
          headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
        });
        items = (await r2.json()) || [];
      }
      items = items.slice(0, 3);
      if (!items.length) return;
      const list = document.getElementById('aside-related-list');
      if (!list) return;
      list.innerHTML = '';
      items.forEach(a => {
        const item = document.createElement('a');
        item.className = 'j-side-rel-item';
        item.href = '/journal/' + encodeURIComponent(a.slug);
        const thumb = document.createElement('div');
        thumb.className = 'j-side-rel-thumb';
        if (a.hero_image) thumb.style.backgroundImage = "url('" + a.hero_image.replace(/'/g, "%27") + "')";
        const title = document.createElement('div');
        title.className = 'j-side-rel-title';
        title.textContent = a.title;
        item.appendChild(thumb); item.appendChild(title);
        list.appendChild(item);
      });
      document.getElementById('aside-related-block').style.display = '';
    } catch(e){ console.warn('related-side failed', e); }
  }

  function setupShareButtons(article){
    const url = location.href;
    const title = (article && article.title) || document.title;
    const x = document.getElementById('aside-share-x');
    const fb = document.getElementById('aside-share-fb');
    const cp = document.getElementById('aside-share-copy');
    if (x) x.href = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(title);
    if (fb) fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
    if (cp){
      cp.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
        cp.textContent = 'Copied';
        setTimeout(() => { cp.textContent = 'Copy'; }, 1800);
      });
    }
  }

  function getCurrentSlug(){
    const m = location.pathname.match(/\/journal\/([^/?#]+)/);
    if (m) return decodeURIComponent(m[1]);
    const u = new URL(location.href);
    return u.searchParams.get('slug') || '';
  }

  function getCurrentCategory(){
    const elt = document.querySelector('.j-cat-line');
    if (elt && elt.dataset && elt.dataset.cat) return elt.dataset.cat;
    return null;
  }

  async function loadCrossBanners(){
    try {
      const target = document.getElementById('aside-banners');
      if (!target) return;
      const [off, caf] = await Promise.all([
        fetch('/shared/banner-officemill.html').then(r => r.ok ? r.text() : ''),
        fetch('/shared/banner-cafemill.html').then(r => r.ok ? r.text() : '')
      ]);
      target.innerHTML = (off || '') + (caf || '');
    } catch(e){ console.warn('cross-banner failed', e); }
  }

  function init(){
    const main = document.getElementById('main');
    if (!main) return;
    let done = false;
    const run = (article) => {
      if (done) return;
      done = true;
      const wrapped = wrapWithSidebar(article);
      if (!wrapped) return;
      const slug = getCurrentSlug();
      const cat = getCurrentCategory();
      const articleData = { title: document.title || '' };
      bumpViewCount(slug);
      loadRanking(slug);
      loadPicks();
      loadSidebarRelated(slug, cat);
      setupShareButtons(articleData);
      loadCrossBanners();
    };
    const existing = main.querySelector('article.j-article');
    if (existing){ run(existing); return; }
    const obs = new MutationObserver(() => {
      const a = main.querySelector('article.j-article');
      if (a){ obs.disconnect(); run(a); }
    });
    obs.observe(main, { childList: true, subtree: true });
    // safety timeout
    setTimeout(() => obs.disconnect(), 15000);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
