<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>施設マスタ — COWORKMILL journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #121212; color: #f0f0f0; }
.container { padding: 24px; }
.header { border-bottom: 1px solid #2a2a2a; padding-bottom: 16px; margin-bottom: 20px; }
.header h1 { margin: 0 0 8px; font-size: 22px; background: linear-gradient(135deg, #79F1A4, #0E5CAD); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: inline-block; }
.header p { margin: 0; color: #888; font-size: 13px; line-height: 1.6; }
.filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 240px; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; color: #f0f0f0; border-radius: 8px; font-size: 14px; }
.search-input:focus { border-color: #79F1A4; outline: none; }
.sort-select { padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; color: #f0f0f0; border-radius: 8px; font-size: 13px; cursor: pointer; }
.add-btn { background: linear-gradient(135deg, #79F1A4, #0E5CAD); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
.tag-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag-chip { padding: 5px 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; font-size: 12px; cursor: pointer; user-select: none; }
.tag-chip:hover { border-color: #555; }
.tag-chip.on { background: linear-gradient(135deg, #79F1A4, #0E5CAD); color: #000; border-color: transparent; font-weight: 700; }
.hit-count { margin-bottom: 12px; font-size: 14px; color: #888; padding: 10px 14px; background: #1a1a1a; border-radius: 8px; }
.hit-count.candidate { color: #000; background: linear-gradient(135deg, #79F1A4, #0E5CAD); font-weight: 700; font-size: 16px; }
.table-wrap { overflow-x: auto; margin-bottom: 40px; border: 1px solid #2a2a2a; border-radius: 8px; }
table { border-collapse: collapse; font-size: 12px; white-space: nowrap; width: max-content; }
th, td { padding: 6px 8px; border-bottom: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
th { background: #1a1a1a; position: sticky; top: 0; font-weight: 700; text-align: left; font-size: 11px; color: #aaa; z-index: 2; }
th.tag-th { writing-mode: vertical-rl; text-orientation: mixed; text-align: center; min-width: 32px; height: 110px; padding: 8px 4px; }
th.url-th { min-width: 80px; max-width: 80px; text-align: center; }
th.memo-th { min-width: 160px; }
th.area-th { min-width: 140px; }
th.ver-th { min-width: 50px; text-align: center; }
th.cwm-th { min-width: 50px; text-align: center; }
th.del-th { min-width: 40px; text-align: center; }
td.tag-cell { text-align: center; padding: 4px 0; min-width: 32px; }
td.tag-cell input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #79F1A4; }
td.text-cell input { background: transparent; border: 1px solid transparent; color: #f0f0f0; padding: 4px 8px; width: 100%; font-size: 12px; font-family: inherit; }
td.name-cell input { min-width: 200px; }
td.station-cell input { min-width: 100px; }
td.memo-cell input { min-width: 160px; max-width: 240px; font-size: 12px; color: #ffd97a; }
td.url-cell input { min-width: 120px; max-width: 200px; font-size: 11px; color: #aaa; }
td input:hover { border-color: #333; }
td input:focus { border-color: #79F1A4; outline: none; background: #1a1a1a; }
td.url-cell a { color: #79F1A4; text-decoration: none; font-size: 14px; }
td.url-cell .url-wrap { display: flex; gap: 4px; align-items: center; }
td.area-cell select { background: #1a1a1a; border: 1px solid #333; color: #f0f0f0; padding: 4px 8px; font-size: 12px; min-width: 140px; border-radius: 4px; cursor: pointer; font-family: inherit; }
td.area-cell select:focus { border-color: #79F1A4; outline: none; }
td.ver-cell, td.cwm-cell { text-align: center; padding: 4px 0; min-width: 50px; }
td.ver-cell input[type="checkbox"], td.cwm-cell input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #79F1A4; }
td.cwm-cell input[type="checkbox"] { accent-color: #ff9d4a; }
td.del-cell { text-align: center; padding: 4px 0; min-width: 40px; }
.del-btn { background: transparent; border: 1px solid #444; color: #888; cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 14px; transition: all 0.15s; }
.del-btn:hover { background: #c84a4a; color: #fff; border-color: #c84a4a; }
tr.candidate { background: rgba(121, 241, 164, 0.06); }
tr.verified td { opacity: 0.45; }
tr.verified td.ver-cell, tr.verified td.cwm-cell { opacity: 1; }
tr:hover { background: rgba(255, 255, 255, 0.03); }
tr.verified:hover td { opacity: 0.8; }
.empty { padding: 60px 40px; text-align: center; color: #666; }
.save-indicator { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; background: rgba(121, 241, 164, 0.95); color: #000; border-radius: 8px; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-size: 13px; }
.save-indicator.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>施設マスタ</h1>
    <p>左端の ✅入力完了マーク｜🏠 COWORKMILL 掲載済か（非掲載 = 営業先候補）。 雰囲気タグ 5件以上ヒットで「記事化候補」マーク。 編集は即保存。</p>
  </div>
  <div class="filter-bar">
    <input type="search" class="search-input" placeholder="🔍 施設名・駅・エリア・メモで検索（例: サウナ, 仙台エリア）" id="search">
    <select class="sort-select" id="sort">
      <option value="name">あいうえお順（施設名）</option>
      <option value="area">エリア順</option>
      <option value="updated">最近編集順</option>
      <option value="verified">未確認を上に</option>
      <option value="cwm-unlisted">未掲載を上に（営業先）</option>
    </select>
    <button class="add-btn" id="add-btn">+ 新規施設追加</button>
  </div>
  <div class="tag-filters" id="tag-filters"></div>
  <div class="hit-count" id="hit-count">読み込み中...</div>
  <div class="table-wrap"><table><thead><tr id="thead-row"></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<div class="save-indicator" id="save-indicator">✓ 保存しました</div>
<script>
const SUPABASE_URL = 'https://jakwntemjkwqwaqujffh.supabase.co';
const KEY = 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';
const HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const TAGS = ['都市の高層階','古民家・町家','自然・山・海','倉庫・工場跡','ホテル併設','ミュージアム隣接','駅直結','ミニマル・無機質','テラス・屋外席','川沿い・水辺','緑・植物いっぱい','ライブラリー・書棚','歴史的建造物・レトロ','路地裏・隠れ家','アート・ギャラリー空間','吹き抜け・高天井'];
const URL_FIELDS = [
  { key: 'official_url', label: 'HP', icon: '🌐' },
  { key: 'instagram', label: 'IGアカ', icon: '📷' },
  { key: 'ig_post_url', label: 'IG投稿', icon: '🖼️' },
  { key: 'youtube_url', label: 'YT', icon: '🎬' },
  { key: 'twitter_url', label: 'X', icon: '𝕏' }
];
const REGION_AREAS = [
  '渋谷エリア','新宿エリア','池袋エリア','銀座・有楽町エリア',
  '丸の内・大手町エリア','六本木エリア','五反田・品川エリア',
  '恵比寿・中目黒エリア','表参道・青山エリア','秋葉原・神田エリア',
  '上野・浅草エリア','多摩エリア',
  '横浜エリア','川崎エリア','鎌倉・湘南エリア',
  'さいたまエリア','千葉エリア','軽井沢エリア',
  '札幌エリア','仙台エリア','金沢エリア','名古屋エリア',
  '京都エリア','大阪エリア','神戸エリア','広島エリア',
  '福岡エリア','沖縄エリア','その他'
];
let allSpaces = [];
let activeFilters = new Set();
let searchQuery = '';
let sortMode = 'name';
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showSave() { const el = document.getElementById('save-indicator'); el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1200); }
async function loadSpaces() {
  const r = await fetch(SUPABASE_URL + '/rest/v1/spaces?select=*&limit=500', { headers: HEADERS });
  if (!r.ok) { document.getElementById('hit-count').textContent = '❌ 読み込み失敗: ' + r.status; return; }
  const all = await r.json();
  allSpaces = all.filter(s => s.status !== 'archived');
}
function renderTagFilters() {
  const wrap = document.getElementById('tag-filters');
  wrap.innerHTML = '';
  for (const tag of TAGS) {
    const c = document.createElement('span');
    c.className = 'tag-chip';
    c.textContent = tag;
    c.onclick = () => { c.classList.toggle('on'); if (c.classList.contains('on')) activeFilters.add(tag); else activeFilters.delete(tag); render(); };
    wrap.appendChild(c);
  }
}
function renderThead() {
  let h = '<th class="ver-th" title="入力完了">✅</th><th class="cwm-th" title="COWORKMILL掲載済">🏠</th><th>施設店名</th><th>最寄駅</th><th class="area-th">🗾 エリア</th><th class="memo-th">📝 メモ</th>';
  for (const u of URL_FIELDS) h += '<th class="url-th">' + u.icon + ' ' + u.label + '</th>';
  h += TAGS.map(t => '<th class="tag-th">' + esc(t) + '</th>').join('');
  h += '<th class="del-th">🗑️</th>';
  document.getElementById('thead-row').innerHTML = h;
}
function filtered() {
  let list = allSpaces;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(s =>
      (s.name || '').toLowerCase().includes(q) ||
      (s.nearest_station || '').toLowerCase().includes(q) ||
      (s.region_area || '').toLowerCase().includes(q) ||
      (s.tag_notes || '').toLowerCase().includes(q)
    );
  }
  if (activeFilters.size > 0) {
    list = list.filter(s => {
      const tags = s.atmosphere_tags || [];
      for (const t of activeFilters) if (!tags.includes(t)) return false;
      return true;
    });
  }
  list = [...list];
  if (sortMode === 'name') { list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja')); }
  else if (sortMode === 'area') { list.sort((a, b) => { const ba = (a.region_area || 'ｚｚ').localeCompare(b.region_area || 'ｚｚ', 'ja'); if (ba !== 0) return ba; return (a.name || '').localeCompare(b.name || '', 'ja'); }); }
  else if (sortMode === 'updated') { list.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || '')); }
  else if (sortMode === 'verified') { list.sort((a, b) => { const av = a.is_verified ? 1 : 0; const bv = b.is_verified ? 1 : 0; if (av !== bv) return av - bv; return (a.name || '').localeCompare(b.name || '', 'ja'); }); }
  else if (sortMode === 'cwm-unlisted') { list.sort((a, b) => { const ac = a.is_listed_on_coworkmill ? 1 : 0; const bc = b.is_listed_on_coworkmill ? 1 : 0; if (ac !== bc) return ac - bc; return (a.name || '').localeCompare(b.name || '', 'ja'); }); }
  return list;
}
function updateHitCount() {
  const list = filtered();
  const hitEl = document.getElementById('hit-count');
  const q = (searchQuery || '').toLowerCase();
  const hasMemoOrAreaSearch = q && allSpaces.some(s => ((s.tag_notes || '') + (s.region_area || '')).toLowerCase().includes(q));
  const verifiedCount = allSpaces.filter(s => s.is_verified).length;
  const listedCount = allSpaces.filter(s => s.is_listed_on_coworkmill).length;
  const unlistedCount = allSpaces.length - listedCount;
  if (list.length >= 5 && (activeFilters.size > 0 || hasMemoOrAreaSearch)) {
    const label = activeFilters.size > 0 ? Array.from(activeFilters).join(' × ') : '検索:' + searchQuery;
    hitEl.innerHTML = '🎉 ' + list.length + '件ヒット — 「' + esc(label) + '」' + list.length + '選で記事化候補です！';
    hitEl.classList.add('candidate');
  } else if (activeFilters.size > 0 || hasMemoOrAreaSearch) {
    hitEl.textContent = list.length + ' 件（5件以上で記事化候補マーク）/ 全 ' + allSpaces.length + ' 施設';
    hitEl.classList.remove('candidate');
  } else {
    hitEl.textContent = list.length + ' 件 / 全 ' + allSpaces.length + ' 施設（✅ 確認済: ' + verifiedCount + '｜🏠 掲載: ' + listedCount + '｜📞 営業先候補: ' + unlistedCount + '）';
    hitEl.classList.remove('candidate');
  }
}
function urlCellHtml(s, field) {
  const val = s[field] || '';
  const hasVal = val && val.length > 0;
  const linkBtn = hasVal ? '<a href="' + esc(val) + '" target="_blank" rel="noopener" title="開く">🔗</a>' : '';
  return '<td class="url-cell text-cell"><div class="url-wrap"><input value="' + esc(val) + '" data-id="' + s.id + '" data-field="' + field + '" placeholder="URL">' + linkBtn + '</div></td>';
}
function areaCellHtml(s) {
  let opts = '<option value="">（未設定）</option>';
  const cur = s.region_area || '';
  for (const a of REGION_AREAS) opts += '<option value="' + esc(a) + '"' + (a === cur ? ' selected' : '') + '>' + esc(a) + '</option>';
  return '<td class="area-cell"><select data-id="' + s.id + '" data-field="region_area">' + opts + '</select></td>';
}
function render() {
  const list = filtered();
  updateHitCount();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const colCount = 7 + URL_FIELDS.length + TAGS.length;
  if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="' + colCount + '" class="empty">該当する施設がありません</td></tr>'; return; }
  const q = (searchQuery || '').toLowerCase();
  const hasMemoOrAreaSearch = q && allSpaces.some(s => ((s.tag_notes || '') + (s.region_area || '')).toLowerCase().includes(q));
  const isCand = (activeFilters.size > 0 || hasMemoOrAreaSearch) && list.length >= 5;
  for (const s of list) {
    const tr = document.createElement('tr');
    const classes = [];
    if (isCand) classes.push('candidate');
    if (s.is_verified) classes.push('verified');
    if (classes.length > 0) tr.className = classes.join(' ');
    let h = '<td class="ver-cell"><input type="checkbox" class="ver-cb" data-id="' + s.id + '"' + (s.is_verified ? ' checked' : '') + '></td>' +
      '<td class="cwm-cell"><input type="checkbox" class="cwm-cb" data-id="' + s.id + '"' + (s.is_listed_on_coworkmill ? ' checked' : '') + ' title="COWORKMILL 掲載済"></td>' +
      '<td class="text-cell name-cell"><input value="' + esc(s.name) + '" data-id="' + s.id + '" data-field="name"></td>' +
      '<td class="text-cell station-cell"><input value="' + esc(s.nearest_station) + '" data-id="' + s.id + '" data-field="nearest_station" placeholder="駅"></td>' +
      areaCellHtml(s) +
      '<td class="text-cell memo-cell"><input value="' + esc(s.tag_notes) + '" data-id="' + s.id + '" data-field="tag_notes" placeholder="例: サウナ, ペット可"></td>';
    for (const u of URL_FIELDS) h += urlCellHtml(s, u.key);
    for (const t of TAGS) { const c = (s.atmosphere_tags || []).includes(t); h += '<td class="tag-cell"><input type="checkbox" class="tag-cb" data-id="' + s.id + '" data-tag="' + esc(t) + '"' + (c ? ' checked' : '') + '></td>'; }
    h += '<td class="del-cell"><button class="del-btn" data-id="' + s.id + '" data-name="' + esc(s.name) + '" title="削除">🗑️</button></td>';
    tr.innerHTML = h;
    tbody.appendChild(tr);
  }
  bindHandlers();
}
function bindHandlers() {
  const tbody = document.getElementById('tbody');
  tbody.querySelectorAll('input.tag-cb').forEach(cb => { cb.onchange = () => onTagToggle(cb.dataset.id, cb.dataset.tag, cb.checked); });
  tbody.querySelectorAll('input.ver-cb').forEach(cb => { cb.onchange = () => onBoolField(cb.dataset.id, 'is_verified', cb.checked); });
  tbody.querySelectorAll('input.cwm-cb').forEach(cb => { cb.onchange = () => onBoolField(cb.dataset.id, 'is_listed_on_coworkmill', cb.checked); });
  tbody.querySelectorAll('input:not([type="checkbox"])').forEach(inp => { let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => onFieldEdit(inp.dataset.id, inp.dataset.field, inp.value), 700); }; });
  tbody.querySelectorAll('select').forEach(sel => { sel.onchange = () => onFieldEdit(sel.dataset.id, sel.dataset.field, sel.value); });
  tbody.querySelectorAll('.del-btn').forEach(btn => { btn.onclick = () => onDelete(btn.dataset.id, btn.dataset.name); });
}
async function onTagToggle(id, tag, ck) {
  const s = allSpaces.find(x => x.id === id);
  if (!s) return;
  const tags = new Set(s.atmosphere_tags || []);
  if (ck) tags.add(tag); else tags.delete(tag);
  s.atmosphere_tags = Array.from(tags);
  await fetch(SUPABASE_URL + '/rest/v1/spaces?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ atmosphere_tags: s.atmosphere_tags }) });
  showSave();
  updateHitCount();
}
async function onBoolField(id, field, ck) {
  const s = allSpaces.find(x => x.id === id);
  if (!s) return;
  s[field] = ck;
  await fetch(SUPABASE_URL + '/rest/v1/spaces?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ [field]: ck }) });
  showSave();
  render();
}
async function onFieldEdit(id, field, val) {
  const s = allSpaces.find(x => x.id === id);
  if (!s) return;
  s[field] = val;
  await fetch(SUPABASE_URL + '/rest/v1/spaces?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ [field]: val || null }) });
  showSave();
  if (field === 'tag_notes' || field === 'region_area') updateHitCount();
}
async function onDelete(id, name) {
  if (!confirm('「' + name + '」を削除しますか？\n（status=archived にする論理削除です。 DBには残ります。）')) return;
  const r = await fetch(SUPABASE_URL + '/rest/v1/spaces?id=eq.' + id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ status: 'archived' }) });
  if (!r.ok) { alert('削除失敗: ' + r.status + ' — ' + await r.text()); return; }
  allSpaces = allSpaces.filter(x => x.id !== id);
  render();
  showSave();
}
document.getElementById('search').oninput = (e) => { searchQuery = e.target.value; render(); };
document.getElementById('sort').onchange = (e) => { sortMode = e.target.value; render(); };
document.getElementById('add-btn').onclick = async () => {
  const name = prompt('施設店名（必須）');
  if (!name) return;
  const station = prompt('最寄駅（任意）') || null;
  const ns = { name, nearest_station: station, status: 'live', atmosphere_tags: [], slug: 'manual-' + Date.now() };
  const r = await fetch(SUPABASE_URL + '/rest/v1/spaces', { method: 'POST', headers: { ...HEADERS, 'Prefer': 'return=representation' }, body: JSON.stringify(ns) });
  if (!r.ok) { alert('追加失敗: ' + r.status + ' — ' + await r.text()); return; }
  const created = await r.json();
  if (Array.isArray(created) && created[0]) { allSpaces.unshift(created[0]); render(); showSave(); }
};
(async () => { renderTagFilters(); renderThead(); await loadSpaces(); render(); })();
</script>
</body>
</html>
