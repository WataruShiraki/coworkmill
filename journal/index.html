<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COWORKMILL journal — デザインコワーキングの編集メディア</title>
<meta name="description" content="COWORKMILL journal は、デザイン性に優れたコワーキングスペースの取材・選び方・トレンドを伝える編集メディアです。エリアガイド、運営者・建築家インタビュー、ワークスタイル別の選び方など、月10本ペースで記事をお届けします。">
<meta property="og:title" content="COWORKMILL journal">
<meta property="og:description" content="デザインコワーキングの「いま」と「これから」を伝える編集メディア">
<meta property="og:type" content="website">
<meta property="og:url" content="https://coworkmill.vercel.app/journal/">
<meta property="og:site_name" content="COWORKMILL journal">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a; --white:#fff;
  --g50:#fafafa; --g100:#f5f5f5; --g200:#eee; --g300:#ddd; --g400:#aaa; --g500:#888; --g600:#666; --g700:#444; --g800:#333; --g900:#111;
  --teal:#2BB5C8; --green:#79F1A4;
  --fb:'Cormorant Garamond',serif;
  --fd:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fd);font-size:14px;line-height:1.7;color:var(--g900);background:var(--white);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ヘッダー */
.j-nav{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--g200);z-index:100}
.j-nav-inner{max-width:1200px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between}
.j-logo{font-family:var(--fb);font-size:22px;font-weight:600;letter-spacing:.04em;color:var(--g900)}
.j-logo small{font-family:var(--fd);font-size:11px;color:var(--g500);font-weight:400;letter-spacing:.15em;text-transform:uppercase;margin-left:10px}
.j-nav-links{display:flex;gap:28px;font-size:13px;color:var(--g700)}
.j-nav-links a:hover{color:var(--g900)}

/* ヒーロー */
.j-hero{padding:80px 32px 60px;text-align:center;border-bottom:1px solid var(--g200)}
.j-hero-eyebrow{font-family:var(--fb);font-style:italic;font-size:14px;color:var(--g500);letter-spacing:.05em;margin-bottom:14px}
.j-hero h1{font-family:var(--fb);font-size:48px;font-weight:600;letter-spacing:.02em;line-height:1.2;margin-bottom:16px}
.j-hero p{font-size:14px;color:var(--g600);max-width:560px;margin:0 auto;line-height:1.9}

/* カテゴリフィルター */
.j-cats{max-width:1200px;margin:0 auto;padding:32px 32px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.j-cat{padding:8px 18px;border:1px solid var(--g300);border-radius:999px;font-size:12px;color:var(--g700);cursor:pointer;transition:all .2s;background:var(--white)}
.j-cat:hover{border-color:var(--g900);color:var(--g900)}
.j-cat.on{background:var(--g900);color:var(--white);border-color:var(--g900)}

/* 記事グリッド */
.j-grid{max-width:1200px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px 32px}
@media(max-width:900px){.j-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.j-grid{grid-template-columns:1fr;gap:40px;padding:32px 20px 60px}.j-hero h1{font-size:36px}.j-hero{padding:60px 24px 48px}}

.j-card{cursor:pointer;transition:opacity .2s}
.j-card:hover{opacity:.7}
.j-card-img{aspect-ratio:16/10;background:var(--g100);border-radius:4px;overflow:hidden;margin-bottom:16px;background-size:cover;background-position:center}
.j-card-meta{font-family:var(--fb);font-style:italic;font-size:12px;color:var(--g500);margin-bottom:8px;letter-spacing:.04em}
.j-card-cat{font-size:10px;color:var(--teal);font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-right:10px}
.j-card-title{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:10px;color:var(--g900)}
.j-card-excerpt{font-size:13px;color:var(--g600);line-height:1.7;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.j-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.j-tag{font-size:11px;color:var(--g500);background:var(--g100);padding:3px 10px;border-radius:3px}
.j-card-pr{display:inline-block;font-size:10px;color:var(--g500);background:var(--g100);padding:2px 8px;border-radius:3px;margin-left:8px;letter-spacing:.05em}

/* ローディング・空 */
.j-status{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--g500);font-size:13px}

/* フッター */
.j-foot{border-top:1px solid var(--g200);padding:48px 32px;text-align:center;color:var(--g500);font-size:12px}
.j-foot a{color:var(--g700);margin:0 12px}
.j-foot a:hover{color:var(--g900)}
.j-foot-copy{margin-top:20px;font-family:var(--fb);font-style:italic}
</style>
</head>
<body>

<header class="j-nav">
  <div class="j-nav-inner">
    <a href="/journal/" class="j-logo">COWORKMILL <small>journal</small></a>
    <nav class="j-nav-links">
      <a href="/coworkmill.html">施設を探す</a>
      <a href="/journal/">journal</a>
      <a href="/coworkmill-architects.html">建築家</a>
    </nav>
  </div>
</header>

<section class="j-hero">
  <div class="j-hero-eyebrow">— Editorial Notes —</div>
  <h1>COWORKMILL journal</h1>
  <p>デザイン性に優れたコワーキングスペースの取材・選び方・トレンドを伝える編集メディア。<br>エリアガイドから建築家インタビューまで、コワーキングを「知る・選ぶ」を支えます。</p>
</section>

<div class="j-cats" id="cats">
  <button class="j-cat on" data-cat="">すべて</button>
  <button class="j-cat" data-cat="interview">インタビュー</button>
  <button class="j-cat" data-cat="trend">トレンド</button>
  <button class="j-cat" data-cat="news">ニュース</button>
  <button class="j-cat" data-cat="other">その他</button>
</div>

<main class="j-grid" id="grid">
  <div class="j-status">読み込み中...</div>
</main>

<footer class="j-foot">
  <div>
    <a href="/coworkmill.html">COWORKMILL TOP</a>
    <a href="/journal/">journal</a>
    <a href="https://lily-p.com" target="_blank" rel="noopener noreferrer">運営会社</a>
    <a href="/coworkmill-privacy.html">プライバシーポリシー</a>
    <a href="/coworkmill-terms.html">利用規約</a>
  </div>
  <div class="j-foot-copy">© COWORKMILL journal — Edited by Lily Partners LLC</div>
</footer>

<script src="/shared/cwm-security.js"></script>
<script>
const SUPABASE_URL = 'https://jakwntemjkwqwaqujffh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';

const CATEGORY_LABELS = {
  'interview': 'インタビュー',
  'trend': 'トレンド',
  'news': 'ニュース',
  'other': 'その他'
};

let allArticles = [];
let activeCategory = '';

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

async function loadArticles() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/articles?select=id,slug,title,subtitle,category,hero_image,excerpt,tags,author_name,published_at,reading_minutes,is_pr&status=eq.live&order=published_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    allArticles = Array.isArray(data) ? data : [];
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="j-status">記事の読み込みに失敗しました</div>';
  }
}

function render() {
  const filtered = activeCategory ? allArticles.filter(a => a.category === activeCategory) : allArticles;
  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="j-status">' + (activeCategory ? 'このカテゴリの記事はまだありません' : '記事はまだありません') + '</div>';
    return;
  }
  grid.innerHTML = '';
  filtered.forEach(a => {
    const card = document.createElement('a');
    card.className = 'j-card';
    card.href = '/journal/article.html?slug=' + encodeURIComponent(a.slug);
    
    const img = document.createElement('div');
    img.className = 'j-card-img';
    if (a.hero_image && cwm && cwm.safeUrl) {
      img.style.backgroundImage = "url('" + cwm.safeUrl(a.hero_image) + "')";
    } else if (a.hero_image) {
      img.style.backgroundImage = "url('" + a.hero_image.replace(/[\\'"]/g, '') + "')";
    }
    card.appendChild(img);
    
    const meta = document.createElement('div');
    meta.className = 'j-card-meta';
    const catSpan = document.createElement('span');
    catSpan.className = 'j-card-cat';
    catSpan.textContent = CATEGORY_LABELS[a.category] || a.category;
    meta.appendChild(catSpan);
    meta.appendChild(document.createTextNode(formatDate(a.published_at)));
    if (a.reading_minutes) meta.appendChild(document.createTextNode(' · ' + a.reading_minutes + '分'));
    if (a.is_pr) {
      const pr = document.createElement('span');
      pr.className = 'j-card-pr';
      pr.textContent = 'PR';
      meta.appendChild(pr);
    }
    card.appendChild(meta);
    
    const title = document.createElement('h2');
    title.className = 'j-card-title';
    title.textContent = a.title;
    card.appendChild(title);
    
    if (a.excerpt) {
      const ex = document.createElement('p');
      ex.className = 'j-card-excerpt';
      ex.textContent = a.excerpt;
      card.appendChild(ex);
    }
    
    if (a.tags && Array.isArray(a.tags) && a.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'j-card-tags';
      a.tags.slice(0, 3).forEach(t => {
        const tag = document.createElement('span');
        tag.className = 'j-tag';
        tag.textContent = '#' + t;
        tags.appendChild(tag);
      });
      card.appendChild(tags);
    }
    
    grid.appendChild(card);
  });
}

document.getElementById('cats').addEventListener('click', e => {
  if (!e.target.classList.contains('j-cat')) return;
  document.querySelectorAll('.j-cat').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
  activeCategory = e.target.dataset.cat || '';
  render();
});

loadArticles();
</script>
</body>
</html>
