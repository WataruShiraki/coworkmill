<style>
:root{
  --bg:#121212; --bg-2:#1a1a1a; --bg-3:#222; --bg-4:#2a2a2a;
  --fg:#f0f0f0; --fg-2:#ccc; --fg-3:#999; --fg-4:#666;
  --line:#2a2a2a; --line-2:#333;
  --teal:#79F1A4; --teal-2:#2BB5C8;
  --fb:'Cormorant Garamond',serif;
  --fd:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fd);font-size:14px;line-height:1.7;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ヘッダー(COWORKMILL本体と統一) */
.j-nav{position:sticky;top:0;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:100}
.j-nav-inner{max-width:1400px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:32px}
.j-logo{display:flex;align-items:center;gap:0}
.j-logo img{height:32px;width:auto;display:block}
.j-nav-links{display:flex;gap:28px;font-size:12.5px;color:var(--fg-2);align-items:center}
.j-nav-links a{transition:color .2s}
.j-nav-links a:hover{color:var(--fg)}
.j-nav-links a.j-active{color:var(--fg)}
.j-nav-links a.j-back-to-main{font-family:var(--fb);font-style:italic;font-size:13px;color:var(--fg-3);letter-spacing:.04em;transition:color .2s}
.j-nav-links a.j-back-to-main:hover{color:var(--fg)}

/* ジャーナルラベル(雑誌っぽいセリフ) */
.j-brand-label{font-family:var(--fb);font-style:italic;font-size:20px;color:var(--fg-2);letter-spacing:.02em;margin-left:10px;line-height:1;position:relative;top:1px}

/* ヒーロー */
.j-hero{padding:90px 32px 70px;text-align:center;border-bottom:1px solid var(--line)}
.j-hero-eyebrow{font-family:var(--fb);font-style:italic;font-size:14px;color:var(--fg-4);letter-spacing:.05em;margin-bottom:16px}
.j-hero h1{font-family:var(--fb);font-size:56px;font-weight:500;letter-spacing:.02em;line-height:1.15;margin-bottom:20px;color:var(--fg)}
.j-hero p{font-size:13.5px;color:var(--fg-3);max-width:600px;margin:0 auto;line-height:1.95;word-break:auto-phrase;line-break:strict;text-wrap:pretty}

/* カテゴリフィルター */
.j-cats{max-width:1200px;margin:0 auto;padding:32px 32px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.j-cat{padding:8px 18px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;color:var(--fg-3);cursor:pointer;transition:all .2s;background:transparent;font-family:var(--fd)}
.j-cat:hover{border-color:var(--fg-3);color:var(--fg-2)}
.j-cat.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* 記事グリッド */
.j-grid{max-width:1200px;margin:0 auto;padding:48px 32px 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:56px 32px}
@media(max-width:900px){.j-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.j-grid{grid-template-columns:1fr;gap:48px;padding:32px 20px 60px}.j-hero h1{font-size:40px}.j-hero{padding:70px 24px 56px}}

.j-card{cursor:pointer;transition:opacity .2s}
.j-card:hover{opacity:.85}
.j-card:hover .j-card-title{color:var(--teal)}
.j-card-img{aspect-ratio:16/10;background:var(--bg-3);border-radius:4px;overflow:hidden;margin-bottom:18px;background-size:cover;background-position:center}
.j-card-meta{font-family:var(--fb);font-style:italic;font-size:12px;color:var(--fg-4);margin-bottom:10px;letter-spacing:.04em}
.j-card-cat{font-size:10px;color:var(--teal);font-weight:500;letter-spacing:.15em;text-transform:uppercase;margin-right:12px;font-family:var(--fd);font-style:normal}
.j-card-title{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:10px;color:var(--fg);transition:color .2s}
.j-card-excerpt{font-size:12.5px;color:var(--fg-3);line-height:1.8;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.j-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.j-tag{font-size:10.5px;color:var(--fg-3);background:var(--bg-3);padding:3px 10px;border-radius:3px}
.j-card-pr{display:inline-block;font-size:9.5px;color:var(--fg-4);background:var(--bg-3);padding:2px 8px;border-radius:3px;margin-left:8px;letter-spacing:.05em;font-family:var(--fd);font-style:normal}

/* ローディング・空 */
.j-status{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--fg-4);font-size:13px}

/* フッター */
.j-foot{border-top:1px solid var(--line);padding:48px 32px;text-align:center;color:var(--fg-4);font-size:12px}
.j-foot a{color:var(--fg-3);margin:0 12px;transition:color .2s}
.j-foot a:hover{color:var(--fg)}
.j-foot-copy{margin-top:20px;font-family:var(--fb);font-style:italic;color:var(--fg-4)}
</style>

<body>

<header class="j-nav">
  <div class="j-nav-inner">

      <img src="/shared/coworkmill-logo.svg" alt="COWORKMILL">

      <a href="/coworkmill.html" class="j-back-to-main">← COWORKMILL TOP</a>
    </nav>

</header>

<section class="j-hero">
  <div class="j-hero-eyebrow">— Editorial Notes —</div>

  <p>デザイン性に優れたコワーキングを、取材・トレンド・選び方で伝える編集メディア。「知る・選ぶ」を支えます。</p>

<div class="j-cats" id="cats">

  </div>

<script src="/shared/cwm-security.js"></script>
<script>
const SUPABASE_URL = 'https://jakwntemjkwqwaqujffh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';

const CATEGORY_LABELS = {
  'interview': 'インタビュー',
  'trend': 'トレンド',
  'news': 'ニュース',
  'other': 'その他'
};

let allArticles = [];
let activeCategory = '';

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

async function loadArticles() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/articles?select=id,slug,title,subtitle,category,hero_image,excerpt,tags,author_name,published_at,reading_minutes,is_pr&status=eq.live&order=published_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    allArticles = Array.isArray(data) ? data : [];
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="j-status">記事の読み込みに失敗しました</div>';
  }
}

function render() {
  const filtered = activeCategory ? allArticles.filter(a => a.category === activeCategory) : allArticles;
  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="j-status">' + (activeCategory ? 'このカテゴリの記事はまだありません' : '記事はまだありません') + '</div>';
    return;
  }
  grid.innerHTML = '';
  filtered.forEach(a => {
    const card = document.createElement('a');
    card.className = 'j-card';
    card.href = '/journal/' + encodeURIComponent(a.slug);
    
    const img = document.createElement('div');
    img.className = 'j-card-img';
    if (a.hero_image && cwm && cwm.safeUrl) {
      img.style.backgroundImage = "url('" + cwm.safeUrl(a.hero_image) + "')";
    }
    card.appendChild(img);
    
    const meta = document.createElement('div');
    meta.className = 'j-card-meta';
    const catSpan = document.createElement('span');
    catSpan.className = 'j-card-cat';
    catSpan.textContent = CATEGORY_LABELS[a.category] || a.category;
    meta.appendChild(catSpan);
    meta.appendChild(document.createTextNode(formatDate(a.published_at)));
    if (a.reading_minutes) meta.appendChild(document.createTextNode(' · ' + a.reading_minutes + '分'));
    if (a.is_pr) {
      const pr = document.createElement('span');
      pr.className = 'j-card-pr';
      pr.textContent = 'PR';
      meta.appendChild(pr);
    }
    card.appendChild(meta);
    
    const title = document.createElement('h2');
    title.className = 'j-card-title';
    title.textContent = a.title;
    card.appendChild(title);
    
    if (a.excerpt) {
      const ex = document.createElement('p');
      ex.className = 'j-card-excerpt';
      ex.textContent = a.excerpt;
      card.appendChild(ex);
    }
    
    if (a.tags && Array.isArray(a.tags) && a.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'j-card-tags';
      a.tags.slice(0, 3).forEach(t => {
        const tag = document.createElement('span');
        tag.className = 'j-tag';
        tag.textContent = '#' + t;
        tags.appendChild(tag);
      });
      card.appendChild(tags);
    }
    
    grid.appendChild(card);
  });
}

document.getElementById('cats').addEventListener('click', e => {
  if (!e.target.classList.contains('j-cat')) return;
  document.querySelectorAll('.j-cat').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
  activeCategory = e.target.dataset.cat || '';
  render();
});

loadArticles();
</script>
</body>
