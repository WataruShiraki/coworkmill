<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COWORKMILL — 特徴の棚（実装版・データ接続）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15140f;--ink:#ece8dc;--mut:#a8a38f;--faint:#6f6a5a;--line:#332f27;--accent:#87a9d6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
.devbar{font-size:11px;letter-spacing:.03em;color:var(--faint);padding:14px 0;border-bottom:1px solid var(--line);}
.devbar b{color:var(--mut);font-weight:700;margin-right:14px;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.fs{padding:60px 0 10px;}
.fs-eyebrow{font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--accent);}
.fs-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:38px;line-height:1.4;margin-top:18px;}
.fs-sub{font-size:13.5px;color:var(--mut);line-height:1.95;margin-top:16px;max-width:560px;}
.fs-reshuffle{margin-top:24px;display:inline-flex;align-items:center;gap:9px;background:none;border:1px solid var(--line);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;padding:11px 21px;border-radius:999px;cursor:pointer;transition:.2s;}
.fs-reshuffle:hover{border-color:var(--accent);color:var(--accent);}
.fs-shelf{margin-top:46px;}
.fs-shelf-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:13px;}
.fs-shelf-name{font-family:'Manrope','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:21px;}
.fs-all{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;}
.fs-row{display:flex;gap:18px;margin-top:20px;overflow-x:auto;padding-bottom:12px;}
.fs-row::-webkit-scrollbar{height:6px;}
.fs-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.fs-card{flex:0 0 180px;cursor:pointer;text-decoration:none;color:inherit;display:block;}
.fs-ph{width:180px;height:240px;border-radius:11px;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:transform .45s cubic-bezier(.2,.7,.2,1);}
.fs-ph::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 78% at 80% 6%,rgba(255,250,235,.30),rgba(255,250,235,0) 56%);}
.fs-ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 56%,rgba(0,0,0,.36));}
.fs-card:hover .fs-ph{transform:scale(1.03);}
.fs-name{margin-top:13px;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fs-desc{margin-top:5px;font-size:12.5px;color:var(--mut);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fs-area{margin-top:7px;font-size:10.5px;color:var(--faint);letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fs-state{padding:48px 0;color:var(--mut);font-size:13.5px;line-height:1.8;}
#fs-shelves.fade{animation:fd .55s ease;}
@keyframes fd{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.foot{margin-top:64px;padding:26px 0 80px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.85;}
@media(max-width:560px){.fs-title{font-size:26px;}.wrap{padding:0 18px;}.fs-card{flex-basis:142px;}.fs-ph{width:142px;height:190px;}}
</style>
</head>
<body>
<div class="wrap">
<div class="devbar"><b>COWORKMILL 特徴の棚 — 実装版（独立コンポーネント / 案2）</b><span id="src">データ取得中…</span></div>

<!-- ===== 特徴の棚コンポーネント ここから（このsection＋style＋scriptがTOPへ差し込む単位） ===== -->
<section class="fs">
<div class="fs-eyebrow">EXPLORE BY FEATURE</div>
<div class="fs-title">その日の、ひとつの切り口。</div>
<div class="fs-sub">温泉、本棚、暖炉、自然光 —— こだわりの「特徴」ごとに棚を編みました。並ぶ切り口は、訪れるたびに変わります。探すのではなく、出会う。</div>
<button class="fs-reshuffle" id="fs-reshuffle"><span>↻</span> 別の切り口で見る</button>
<div id="fs-shelves"><div class="fs-state">読み込んでいます…</div></div>
</section>
<!-- ===== ここまで ===== -->

<div class="foot">※ 実装版コンポーネントです。棚に出す条件＝「その特徴の写真を登録した施設が3つ以上」。条件を満たした特徴のうち3本をランダムに表示し、カードはすべて施設が登録した写真です。条件を満たす棚が無い場合・取得エラー時はサンプル表示にフォールバックします（上部「データソース」表示で判別）。</div>
</div>
<script>
(function(){
var SB_URL='https://jakwntemjkwqwaqujffh.supabase.co';
var SB_KEY='sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';
var MIN_PHOTOS=3;
var MAX_SHELVES=3;
var TONES=['linear-gradient(158deg,#cdbb98,#6d5c44 58%,#352c1f)','linear-gradient(158deg,#9fae93,#505b49 58%,#2a312a)','linear-gradient(158deg,#bcc0c4,#6c7075 55%,#393c3f)','linear-gradient(158deg,#8c95a9,#454a5b 60%,#262a33)','linear-gradient(158deg,#dab98c,#7c5f43 55%,#38291d)','linear-gradient(158deg,#c4ab7c,#6f5937 58%,#332a1d)','linear-gradient(158deg,#a7a08f,#56513f 58%,#2c2a22)','linear-gradient(158deg,#93a39e,#49544f 58%,#262d2a)'];
var SAMPLE=[
{name:'温泉のある空間',cards:[{n:'KUROGANE 蔵前',d:'打ち合わせの前に、ひとっ風呂。',a:'東京・蔵前'},{n:'湯けむり STUDIO',d:'露天で、考えごとが進む。',a:'大分・別府'},{n:'SLATE 箱根',d:'仕事を終えたら、すぐ湯へ。',a:'神奈川・箱根'},{n:'のぼせ works',d:'源泉かけ流しの集中部屋。',a:'群馬・草津'},{n:'蒸 -mushi- 登別',d:'サウナ後の、外気浴デッキ。',a:'北海道・登別'},{n:'月見湯ベース',d:'夜風呂しながら、締切を越える。',a:'長野・上田'}]},
{name:'本棚が豊かな空間',cards:[{n:'SLATE 金沢',d:'三万冊に囲まれて書く。',a:'石川・金沢'},{n:'倉 -kura- 関内',d:'天井までの本棚が、壁になる。',a:'神奈川・横浜'},{n:'文庫LOUNGE 神保町',d:'古書の匂いの中で集中する。',a:'東京・神保町'},{n:'KUROGANE 蔵前',d:'建築書ばかりの、読書席。',a:'東京・蔵前'},{n:'ひだまり文庫',d:'借りて読める、返さなくていい。',a:'長野・松本'},{n:'章 -sho- 京都',d:'町家の本棚と、中庭。',a:'京都・烏丸'}]},
{name:'暖炉のある空間',cards:[{n:'焙 -hoji- 清澄白河',d:'薪の音だけが響く朝。',a:'東京・清澄白河'},{n:'山小屋OFFICE',d:'火を見ながら、考える席。',a:'長野・軽井沢'},{n:'ストーブ社 函館',d:'鋳鉄ストーブのある編集部。',a:'北海道・函館'},{n:'焚 -taku- 高山',d:'囲炉裏を囲んで、打ち合わせ。',a:'岐阜・高山'},{n:'KUROGANE 蔵前',d:'土間に、薪ストーブ。',a:'東京・蔵前'},{n:'炉端WORKS 盛岡',d:'火のそばが、一番はかどる。',a:'岩手・盛岡'}]},
{name:'自然光がたっぷり',cards:[{n:'硝子 -glass- 代々木',d:'朝の光で、目が覚める席。',a:'東京・代々木'},{n:'SLATE 金沢',d:'大きな北窓の、アトリエ。',a:'石川・金沢'},{n:'陽だまり那覇',d:'光の差す、白い部屋。',a:'沖縄・那覇'},{n:'ひかり台STUDIO',d:'トップライトの真下で描く。',a:'神奈川・藤沢'},{n:'採光社 京都',d:'障子ごしの、やわらかい光。',a:'京都・北山'},{n:'倉 -kura- 関内',d:'倉庫窓から差す、午後の光。',a:'神奈川・横浜'}]}
];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function loc(sp){if(sp.nearest_station)return sp.nearest_station;var a=sp.area||'';return a.split('・').slice(0,2).join('・');}
function cardHTML(c,i){
var st=(c.img&&/^https?:/.test(c.img))?('background-image:url('+c.img+')'):('background:'+(c.img||TONES[i%TONES.length]));
return '<a class="fs-card" href="#"><div class="fs-ph" style="'+st+'"></div><div class="fs-name">'+esc(c.n)+'</div><div class="fs-desc">'+esc(c.d)+'</div><div class="fs-area">'+esc(c.a)+'</div></a>';
}
function render(shelves){
var pick=shuffle(shelves).slice(0,MAX_SHELVES);
var html=pick.map(function(s){
var cs=shuffle(s.cards).map(cardHTML).join('');
return '<div class="fs-shelf"><div class="fs-shelf-head"><div class="fs-shelf-name">'+esc(s.name)+'</div><a class="fs-all" href="#">すべて見る →</a></div><div class="fs-row">'+cs+'</div></div>';
}).join('');
var el=document.getElementById('fs-shelves');
el.innerHTML=html||'<div class="fs-state">表示できる棚がまだありません。</div>';
el.classList.remove('fade');void el.offsetWidth;el.classList.add('fade');
}
function setSrc(color,msg){document.getElementById('src').innerHTML='<span class="dot" style="background:'+color+'"></span>'+msg;}
function loadLive(){
var q=SB_URL+'/rest/v1/tags?select=name,show_on_shelf,space_tags(photo_url,description,spaces(name,slug,area,prefecture,nearest_station,status))&show_on_shelf=eq.true';
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},7000);
return fetch(q,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},signal:ctrl.signal}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(tags){
var shelves=[];
(tags||[]).forEach(function(t){
var cards=[];
(t.space_tags||[]).forEach(function(stg){
var sp=stg.spaces;if(!sp)return;
if(sp.status&&sp.status!=='live')return;
if(!stg.photo_url)return;
cards.push({n:sp.name||'(無題)',d:stg.description||'',a:loc(sp),img:stg.photo_url,slug:sp.slug||''});
});
if(cards.length>=MIN_PHOTOS)shelves.push({name:t.name,cards:cards});
});
return shelves;
});
}
loadLive().then(function(shelves){
if(shelves&&shelves.length){setSrc('#7ea87e','データソース：Supabase（ライブ）／ 写真が3施設以上そろった棚 '+shelves.length+' 本');window._FS=shelves;render(shelves);}
else{setSrc('#caa46a','データソース：サンプル（写真を3施設以上が登録した特徴がまだ無いため。施設が特徴ごとの写真を登録すると、ここに実データの棚が出ます）');window._FS=SAMPLE;render(SAMPLE);}
}).catch(function(e){
setSrc('#c98b8b','データソース：サンプル（ライブ取得エラー: '+esc(e.message||e)+'）');window._FS=SAMPLE;render(SAMPLE);
});
document.getElementById('fs-reshuffle').addEventListener('click',function(){render(window._FS||SAMPLE);});
})();
</script>
</body>
</html>
