<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>journal 管理 — COWORKMILL</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/coworkmill_icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<style>
:root{
  --bg:#121212; --bg-2:#1a1a1a; --bg-3:#222; --bg-4:#2a2a2a;
  --fg:#f0f0f0; --fg-2:#ccc; --fg-3:#999; --fg-4:#666;
  --line:#2a2a2a; --line-2:#333;
  --teal:#79F1A4; --teal-2:#2BB5C8;
  --red:#f87171; --orange:#f59e0b;
  --fb:'Cormorant Garamond',serif;
  --fd:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fd);font-size:13px;line-height:1.7;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--fg);background:var(--bg-3);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
label{font-size:12px;color:var(--fg-3);display:block;margin-bottom:6px}

/* ===== ログイン画面 ===== */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:48px 40px;width:100%;max-width:400px}
.login-card .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.login-card .logo img{height:28px}
.login-card .logo .label{font-family:var(--fb);font-style:italic;font-size:18px;color:var(--fg-2);line-height:1}
.login-card h1{font-size:14px;font-weight:500;color:var(--fg-3);margin-bottom:32px}
.login-card .field{margin-bottom:18px}
.login-btn{width:100%;background:var(--teal);color:var(--bg);font-weight:600;padding:12px;border-radius:4px;margin-top:12px;font-size:13px;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{background:rgba(248,113,113,.1);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:4px;font-size:12px;margin-top:14px}
.login-help{margin-top:24px;padding-top:24px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-4);line-height:1.7}

/* ===== ヘッダー ===== */
.app-nav{position:sticky;top:0;background:rgba(18,18,18,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:100}
.app-nav-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.app-logo{display:flex;align-items:center;gap:10px}
.app-logo img{height:28px}
.app-logo .label{font-family:var(--fb);font-style:italic;font-size:17px;color:var(--fg-2);line-height:1}
.app-meta{display:flex;align-items:center;gap:16px;font-size:12px}
.app-user{color:var(--fg-3)}
.app-user b{color:var(--fg);font-weight:500}
.app-logout{padding:6px 14px;border:1px solid var(--line-2);border-radius:4px;color:var(--fg-3);transition:all .15s;font-size:11.5px}
.app-logout:hover{border-color:var(--fg-3);color:var(--fg)}

/* ===== 記事一覧 ===== */
.app-main{max-width:1400px;margin:0 auto;padding:32px 24px 60px}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.list-head h2{font-size:20px;font-weight:600}
.list-head .h-meta{font-size:12px;color:var(--fg-3);margin-left:8px;font-weight:400}
.btn-primary{background:var(--teal);color:var(--bg);padding:10px 20px;border-radius:4px;font-weight:600;font-size:12.5px;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--bg-3);color:var(--fg-2);padding:10px 20px;border-radius:4px;font-size:12.5px;border:1px solid var(--line-2);transition:all .15s}
.btn-secondary:hover{border-color:var(--fg-3);color:var(--fg)}
.btn-danger{background:transparent;color:var(--red);padding:8px 14px;border-radius:4px;font-size:12px;border:1px solid rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.1)}

.articles-grid{display:flex;flex-direction:column;gap:14px}
.article-row{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:18px 22px;display:flex;align-items:center;gap:20px;transition:border-color .15s}
.article-row:hover{border-color:var(--line-2)}
.article-row .a-status{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:3px;flex-shrink:0;min-width:60px;text-align:center}
.a-status.live{background:rgba(121,241,164,.15);color:var(--teal)}
.a-status.draft{background:rgba(245,158,11,.15);color:var(--orange)}
.a-status.archived{background:var(--bg-3);color:var(--fg-4)}
.a-status.scheduled{background:rgba(43,181,200,.15);color:var(--teal-2)}
.article-row .a-body{flex:1;min-width:0}
.article-row .a-title{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.article-row .a-meta{font-size:11.5px;color:var(--fg-4)}
.article-row .a-cat{color:var(--teal);text-transform:uppercase;letter-spacing:.1em;font-weight:500;margin-right:10px}
.article-row .a-actions{display:flex;gap:8px;flex-shrink:0}

.empty{text-align:center;padding:80px 20px;color:var(--fg-4);font-size:13px;background:var(--bg-2);border:1px dashed var(--line-2);border-radius:8px}

/* ===== 編集画面 ===== */
.editor-wrap{display:none}
.editor-wrap.show{display:block}
.editor-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.editor-head .back{font-family:var(--fb);font-style:italic;font-size:14px;color:var(--fg-3);transition:color .15s}
.editor-head .back:hover{color:var(--fg)}
.editor-head .save-status{font-size:11px;color:var(--fg-4);margin-left:auto}

.editor-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:980px){.editor-grid{grid-template-columns:1fr}}

.editor-main .field{margin-bottom:16px}
.editor-main input.title-input{font-size:22px;font-weight:600;padding:14px 16px;background:var(--bg-2)}

/* EasyMDE のダーク化 */
.EasyMDEContainer{margin-top:6px}
.EasyMDEContainer .CodeMirror{background:var(--bg-2);color:var(--fg);border-color:var(--line-2);min-height:400px}
.EasyMDEContainer .CodeMirror-cursor{border-color:var(--fg)}
.EasyMDEContainer .editor-toolbar{background:var(--bg-3);border-color:var(--line-2);opacity:1}
.EasyMDEContainer .editor-toolbar button{color:var(--fg-2)!important}
.EasyMDEContainer .editor-toolbar button:hover,.EasyMDEContainer .editor-toolbar button.active{background:var(--bg-4);border-color:var(--line-2);color:var(--fg)!important}
.EasyMDEContainer .editor-toolbar i.separator{border-color:var(--line-2)}
.EasyMDEContainer .editor-statusbar{color:var(--fg-4)}
.EasyMDEContainer .editor-preview,.EasyMDEContainer .editor-preview-side{background:var(--bg-2);color:var(--fg-2);border-color:var(--line-2)}
.EasyMDEContainer .editor-preview h1,.EasyMDEContainer .editor-preview h2,.EasyMDEContainer .editor-preview h3{color:var(--fg)}
.EasyMDEContainer .editor-preview a{color:var(--teal)}
.EasyMDEContainer .editor-preview blockquote{border-left:3px solid var(--teal);color:var(--fg-3)}
.CodeMirror-fullscreen,.editor-preview-side,.editor-preview-active-side{z-index:200}

.editor-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.side-card{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.side-card h3{font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-weight:500}
.side-card .field{margin-bottom:12px}
.side-card .field:last-child{margin-bottom:0}
.side-card textarea{min-height:60px;resize:vertical}
.side-card .actions{display:flex;flex-direction:column;gap:8px}
.side-card .actions button{width:100%}

/* 画像挿入モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:300;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:32px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:18px}
.modal .field{margin-bottom:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal small{font-size:11px;color:var(--fg-4);margin-top:4px;display:block;line-height:1.6}

.flash{position:fixed;bottom:24px;right:24px;background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--teal);padding:12px 18px;border-radius:4px;font-size:12px;z-index:400;display:none;max-width:380px}
.flash.show{display:block}
.flash.error{border-left-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<!-- ============== ログイン画面 ============== -->
<section class="login-screen" id="screen-login">
  <div class="login-card">
    <div class="logo">
      <img src="/shared/coworkmill-logo.svg" alt="COWORKMILL">
      <span class="label">journal</span>
    </div>
    <h1>編集者ログイン</h1>
    <form id="login-form">
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-submit">ログイン</button>
      <div class="login-error" id="login-error" style="display:none"></div>
    </form>
    <div class="login-help">
      ID・パスワードは編集部から発行されます。<br>
      パスワードを忘れた場合は編集部までご連絡ください。
    </div>
  </div>
</section>

<!-- ============== アプリ本体(ログイン後) ============== -->
<header class="app-nav" id="screen-app-nav" style="display:none">
  <div class="app-nav-inner">
    <a href="/journal/" class="app-logo">
      <img src="/shared/coworkmill-logo.svg" alt="COWORKMILL">
      <span class="label">journal</span>
    </a>
    <div class="app-meta">
      <span class="app-user"><b id="user-name">—</b> としてログイン中</span>
      <button class="app-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
</header>

<main class="app-main" id="screen-app" style="display:none">

  <!-- 記事一覧 -->
  <section id="view-list">
    <div class="list-head">
      <h2>あなたの記事 <span class="h-meta" id="list-count"></span></h2>
      <button class="btn-primary" onclick="newArticle()">+ 新しい記事を書く</button>
    </div>
    <div id="articles-area"><div class="empty">読み込み中...</div></div>
  </section>

  <!-- 編集画面 -->
  <section class="editor-wrap" id="view-editor">
    <div class="editor-head">
      <a href="#" class="back" onclick="backToList();return false">← 一覧に戻る</a>
      <span class="save-status" id="save-status"></span>
    </div>
    <div class="editor-grid">
      <div class="editor-main">
        <div class="field">
          <input type="text" class="title-input" id="ed-title" placeholder="記事タイトル(1〜200文字)" maxlength="200">
        </div>
        <div class="field">
          <input type="text" id="ed-subtitle" placeholder="サブタイトル(任意・300文字以内)" maxlength="300">
        </div>
        <div class="field">
          <textarea id="ed-body" placeholder="本文(Markdown 対応)"></textarea>
        </div>
      </div>

      <aside class="editor-side">
        <div class="side-card">
          <h3>公開設定</h3>
          <div class="field">
            <label>ステータス</label>
            <select id="ed-status">
              <option value="draft">下書き</option>
              <option value="live">公開</option>
              <option value="archived">アーカイブ</option>
            </select>
          </div>
          <div class="field">
            <label>カテゴリ</label>
            <select id="ed-category">
              <option value="interview">インタビュー</option>
              <option value="trend">トレンド</option>
              <option value="news">ニュース</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="field">
            <label>スラッグ(URL)</label>
            <input type="text" id="ed-slug" placeholder="my-article" pattern="[a-z0-9-]+" maxlength="100">
            <small style="color:var(--fg-4);font-size:11px;margin-top:4px;display:block">英小文字・数字・ハイフンのみ</small>
          </div>
          <div class="actions">
            <button class="btn-primary" onclick="saveArticle()">保存</button>
            <button class="btn-secondary" onclick="previewArticle()">プレビュー</button>
            <button class="btn-danger" id="btn-delete" onclick="deleteArticle()" style="display:none">記事を削除</button>
          </div>
        </div>

        <div class="side-card">
          <h3>記事メタ情報</h3>
          <div class="field">
            <label>抜粋(500文字以内)</label>
            <textarea id="ed-excerpt" maxlength="500" placeholder="記事カードに表示される一文"></textarea>
          </div>
          <div class="field">
            <label>タグ(カンマ区切り)</label>
            <input type="text" id="ed-tags" placeholder="渋谷, 取材, 内装">
          </div>
          <div class="field">
            <label>ヒーロー画像 URL</label>
            <input type="text" id="ed-hero" placeholder="https://...">
          </div>
          <div class="field">
            <label>読了時間(分)</label>
            <input type="number" id="ed-reading" min="1" max="120" placeholder="3">
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>

<!-- 画像挿入モーダル -->
<div class="modal-overlay" id="img-modal">
  <div class="modal">
    <h3>画像を挿入(出所必須)</h3>
    <div class="field">
      <label>画像 URL</label>
      <input type="text" id="img-url" placeholder="https://...">
      <small>Supabase Storage アップロードは Phase 2-6 で実装予定。今は外部 URL を入れてください。</small>
    </div>
    <div class="field">
      <label>代替テキスト(alt)<span style="color:var(--red)"> *</span></label>
      <input type="text" id="img-alt" maxlength="500" placeholder="アクセシビリティのため必須">
    </div>
    <div class="field">
      <label>ソース種別<span style="color:var(--red)"> *</span></label>
      <select id="img-source-type">
        <option value="own">自社撮影</option>
        <option value="facility">施設提供</option>
        <option value="stock">ストック写真(Unsplash 等)</option>
        <option value="ai">AI 生成</option>
        <option value="cc">クリエイティブ・コモンズ</option>
      </select>
    </div>
    <div class="field" id="img-source-name-wrap">
      <label>ソース名 <small>(stock の場合は必須:Unsplash / Pexels 等)</small></label>
      <input type="text" id="img-source-name" placeholder="Unsplash">
    </div>
    <div class="field">
      <label>撮影者・著者</label>
      <input type="text" id="img-photographer">
    </div>
    <div class="field" id="img-permission-wrap">
      <label>掲載許諾メモ <small>(facility の場合は必須)</small></label>
      <input type="text" id="img-permission" placeholder="2026/05 メールで許諾済み">
    </div>
    <div class="row">
      <button class="btn-secondary" onclick="closeImgModal()">キャンセル</button>
      <button class="btn-primary" onclick="insertImage()">挿入</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script>
const SUPABASE_URL = 'https://jakwntemjkwqwaqujffh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ';
const SB_AUTH_KEY = 'sb-jakwntemjkwqwaqujffh-auth-token';

let session = null;
let writerProfile = null;
let currentArticle = null;
let mde = null;

// =================== Auth ===================
function getSession(){
  try { return JSON.parse(localStorage.getItem(SB_AUTH_KEY) || 'null'); } catch(e) { return null; }
}
function setSession(s){
  if (s) localStorage.setItem(SB_AUTH_KEY, JSON.stringify(s));
  else localStorage.removeItem(SB_AUTH_KEY);
  session = s;
}

async function login(email, password){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || 'ログインに失敗しました');
  setSession(data);
  return data;
}

async function loadWriterProfile(){
  if (!session?.access_token) return null;
  const r = await fetch(SUPABASE_URL + '/rest/v1/journal_writers?select=*&user_id=eq.' + session.user.id + '&limit=1', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token }
  });
  const data = await r.json();
  if (Array.isArray(data) && data[0]) {
    writerProfile = data[0];
    if (writerProfile.status !== 'active') {
      throw new Error('アカウントが停止されています。編集部までご連絡ください。');
    }
    return writerProfile;
  }
  throw new Error('ライタープロフィールが見つかりません。編集部までご連絡ください。');
}

function logout(){
  setSession(null);
  writerProfile = null;
  location.reload();
}

// =================== Articles CRUD ===================
async function loadArticles(){
  const r = await fetch(SUPABASE_URL + '/rest/v1/articles?select=*&author_user_id=eq.' + session.user.id + '&order=updated_at.desc', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token }
  });
  const data = await r.json();
  return Array.isArray(data) ? data : [];
}

const CATEGORY_LABELS = {
  'interview': 'インタビュー','trend': 'トレンド','news': 'ニュース','other': 'その他'
};
const STATUS_LABELS = {
  'live':'公開','draft':'下書き','archived':'アーカイブ','scheduled':'予約'
};

function renderList(articles){
  const area = document.getElementById('articles-area');
  document.getElementById('list-count').textContent = '(' + articles.length + '件)';
  if (!articles.length){
    area.innerHTML = '<div class="empty">まだ記事がありません。<br>「+ 新しい記事を書く」から最初の記事を書いてみましょう。</div>';
    return;
  }
  area.innerHTML = '';
  articles.forEach(a => {
    const row = document.createElement('div');
    row.className = 'article-row';
    
    const status = document.createElement('span');
    status.className = 'a-status ' + a.status;
    status.textContent = STATUS_LABELS[a.status] || a.status;
    row.appendChild(status);
    
    const body = document.createElement('div');
    body.className = 'a-body';
    const title = document.createElement('div');
    title.className = 'a-title';
    title.textContent = a.title || '(無題)';
    body.appendChild(title);
    const meta = document.createElement('div');
    meta.className = 'a-meta';
    const cat = document.createElement('span');
    cat.className = 'a-cat';
    cat.textContent = CATEGORY_LABELS[a.category] || a.category;
    meta.appendChild(cat);
    const date = a.updated_at ? new Date(a.updated_at).toLocaleDateString('ja-JP') : '';
    meta.appendChild(document.createTextNode(date));
    body.appendChild(meta);
    row.appendChild(body);
    
    const actions = document.createElement('div');
    actions.className = 'a-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-secondary';
    editBtn.textContent = '編集';
    editBtn.onclick = () => editArticle(a);
    actions.appendChild(editBtn);
    if (a.status === 'live') {
      const viewBtn = document.createElement('a');
      viewBtn.className = 'btn-secondary';
      viewBtn.href = '/journal/' + encodeURIComponent(a.slug);
      viewBtn.target = '_blank';
      viewBtn.textContent = '表示';
      viewBtn.style.textDecoration = 'none';
      actions.appendChild(viewBtn);
    }
    row.appendChild(actions);
    
    area.appendChild(row);
  });
}

function newArticle(){
  currentArticle = {
    id: null,
    slug: '',
    title: '',
    subtitle: '',
    category: 'interview',
    status: 'draft',
    body_md: '',
    excerpt: '',
    tags: [],
    hero_image: '',
    reading_minutes: null,
    author_user_id: session.user.id,
    author_name: writerProfile.display_name
  };
  showEditor();
}

function editArticle(a){
  currentArticle = JSON.parse(JSON.stringify(a));
  showEditor();
}

function showEditor(){
  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-editor').classList.add('show');
  
  document.getElementById('ed-title').value = currentArticle.title || '';
  document.getElementById('ed-subtitle').value = currentArticle.subtitle || '';
  document.getElementById('ed-slug').value = currentArticle.slug || '';
  document.getElementById('ed-category').value = currentArticle.category || 'interview';
  document.getElementById('ed-status').value = currentArticle.status || 'draft';
  document.getElementById('ed-excerpt').value = currentArticle.excerpt || '';
  document.getElementById('ed-tags').value = (currentArticle.tags || []).join(', ');
  document.getElementById('ed-hero').value = currentArticle.hero_image || '';
  document.getElementById('ed-reading').value = currentArticle.reading_minutes || '';
  document.getElementById('btn-delete').style.display = currentArticle.id ? 'block' : 'none';
  
  if (mde) { mde.toTextArea(); mde = null; }
  mde = new EasyMDE({
    element: document.getElementById('ed-body'),
    initialValue: currentArticle.body_md || '',
    spellChecker: false,
    autoDownloadFontAwesome: true,
    toolbar: [
      'bold','italic','strikethrough','|',
      'heading-2','heading-3','|',
      'quote','unordered-list','ordered-list','|',
      'link',
      { name:'image', action:openImgModal, className:'fa fa-picture-o', title:'画像を挿入' },
      'code','|',
      'preview','side-by-side','fullscreen','|',
      'guide'
    ],
    status: ['lines','words']
  });
  
  window.scrollTo(0, 0);
}

function backToList(){
  if (mde) { mde.toTextArea(); mde = null; }
  document.getElementById('view-editor').classList.remove('show');
  document.getElementById('view-list').style.display = 'block';
  refresh();
}

function slugify(t){
  return (t||'').toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0, 100);
}

async function saveArticle(){
  const slugInput = document.getElementById('ed-slug').value.trim();
  let slug = slugInput;
  if (!slug) {
    slug = slugify(document.getElementById('ed-title').value);
    if (!slug) slug = 'article-' + Date.now();
    document.getElementById('ed-slug').value = slug;
  }
  if (!/^[a-z0-9-]{1,100}$/.test(slug)) {
    flash('スラッグは英小文字・数字・ハイフンのみ', true); return;
  }
  
  const tags = document.getElementById('ed-tags').value.split(',').map(s=>s.trim()).filter(s=>s);
  const reading = parseInt(document.getElementById('ed-reading').value) || null;
  
  const payload = {
    slug,
    title: document.getElementById('ed-title').value.trim(),
    subtitle: document.getElementById('ed-subtitle').value.trim() || null,
    category: document.getElementById('ed-category').value,
    status: document.getElementById('ed-status').value,
    body_md: mde.value(),
    excerpt: document.getElementById('ed-excerpt').value.trim() || null,
    tags: tags.length ? tags : null,
    hero_image: document.getElementById('ed-hero').value.trim() || null,
    reading_minutes: reading,
    author_user_id: session.user.id,
    author_name: writerProfile.display_name
  };
  if (payload.status === 'live' && !currentArticle.published_at) {
    payload.published_at = new Date().toISOString();
  }
  if (!payload.title || payload.title.length > 200) {
    flash('タイトルは1〜200文字で入力してください', true); return;
  }
  
  document.getElementById('save-status').textContent = '保存中...';
  
  try {
    let r;
    if (currentArticle.id) {
      r = await fetch(SUPABASE_URL + '/rest/v1/articles?id=eq.' + currentArticle.id, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });
    } else {
      r = await fetch(SUPABASE_URL + '/rest/v1/articles', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });
    }
    const data = await r.json();
    if (!r.ok) {
      flash((Array.isArray(data) ? data[0] : data)?.message || '保存に失敗しました', true);
      document.getElementById('save-status').textContent = '';
      return;
    }
    currentArticle = Array.isArray(data) ? data[0] : data;
    document.getElementById('btn-delete').style.display = 'block';
    document.getElementById('save-status').textContent = '保存しました ' + new Date().toLocaleTimeString('ja-JP');
    flash('保存しました');
  } catch (e) {
    flash('エラー: ' + e.message, true);
  }
}

async function deleteArticle(){
  if (!currentArticle?.id) return;
  if (!confirm('この記事を削除します。よろしいですか?')) return;
  const r = await fetch(SUPABASE_URL + '/rest/v1/articles?id=eq.' + currentArticle.id, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token }
  });
  if (r.ok) {
    flash('削除しました');
    backToList();
  } else {
    flash('削除に失敗しました', true);
  }
}

function previewArticle(){
  if (!currentArticle?.slug || !currentArticle?.id) {
    flash('プレビューには一度保存が必要です', true); return;
  }
  if (currentArticle.status === 'live') {
    window.open('/journal/' + encodeURIComponent(currentArticle.slug), '_blank');
  } else {
    flash('下書き状態ではプレビュー URL は公開されません。「公開」にして保存後に表示できます。', true);
  }
}

// =================== 画像挿入 ===================
function openImgModal(editor){
  document.getElementById('img-modal').classList.add('show');
  ['img-url','img-alt','img-source-name','img-photographer','img-permission'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('img-source-type').value = 'own';
}
function closeImgModal(){
  document.getElementById('img-modal').classList.remove('show');
}

async function insertImage(){
  const url = document.getElementById('img-url').value.trim();
  const alt = document.getElementById('img-alt').value.trim();
  const sourceType = document.getElementById('img-source-type').value;
  const sourceName = document.getElementById('img-source-name').value.trim();
  const photographer = document.getElementById('img-photographer').value.trim();
  const permission = document.getElementById('img-permission').value.trim();
  
  if (!url) { flash('画像 URL を入力してください', true); return; }
  if (!alt) { flash('代替テキスト(alt)は必須です', true); return; }
  if (sourceType === 'facility' && !permission) { flash('施設提供の場合、掲載許諾メモは必須です', true); return; }
  if (sourceType === 'stock' && !sourceName) { flash('ストック写真の場合、ソース名(Unsplash 等)は必須です', true); return; }
  
  // 記事 id 必須(media_assets は article_id NOT NULL)
  if (!currentArticle?.id) {
    flash('画像挿入には先に記事を保存してください', true); return;
  }
  
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/media_assets', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + session.access_token,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        article_id: currentArticle.id,
        url, alt_text: alt,
        source_type: sourceType,
        source_name: sourceName || null,
        photographer: photographer || null,
        permission_note: permission || null
      })
    });
    if (!r.ok) {
      const err = await r.json();
      flash((Array.isArray(err) ? err[0] : err)?.message || '画像登録に失敗しました', true);
      return;
    }
  } catch(e) {
    flash('画像登録エラー: ' + e.message, true);
    return;
  }
  
  // Markdown に画像を挿入
  const md = '\n![' + alt.replace(/[\[\]]/g,'') + '](' + url + ')\n';
  const cm = mde.codemirror;
  const cur = cm.getCursor();
  cm.replaceRange(md, cur);
  closeImgModal();
  flash('画像を挿入しました(出所も記録されました)');
}

// =================== UI ヘルパ ===================
function flash(msg, isError){
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash show' + (isError ? ' error' : '');
  setTimeout(() => el.classList.remove('show'), 3500);
}

async function refresh(){
  const list = await loadArticles();
  renderList(list);
}

// =================== 起動 ===================
async function bootstrap(){
  session = getSession();
  if (!session?.access_token) {
    showLoginScreen();
    return;
  }
  // セッション期限チェック
  if (session.expires_at && Date.now() / 1000 > session.expires_at - 60) {
    setSession(null);
    showLoginScreen();
    return;
  }
  try {
    await loadWriterProfile();
    showApp();
  } catch (e) {
    setSession(null);
    showLoginScreen(e.message);
  }
}

function showLoginScreen(errMsg){
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('screen-app-nav').style.display = 'none';
  document.getElementById('screen-app').style.display = 'none';
  if (errMsg) {
    const e = document.getElementById('login-error');
    e.textContent = errMsg; e.style.display = 'block';
  }
}

function showApp(){
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app-nav').style.display = 'block';
  document.getElementById('screen-app').style.display = 'block';
  document.getElementById('user-name').textContent = writerProfile.display_name;
  refresh();
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '認証中...';
  try {
    await login(
      document.getElementById('login-email').value.trim(),
      document.getElementById('login-password').value
    );
    await loadWriterProfile();
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.textContent = 'ログイン';
    btn.disabled = false;
  }
});

bootstrap();
</script>
