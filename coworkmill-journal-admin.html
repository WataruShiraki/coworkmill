<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>journal 管理 — COWORKMILL</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/coworkmill_icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
:root{
  --bg:#fafafa; --bg-2:#fff; --bg-3:#f4f4f4; --bg-4:#ebebeb;
  --fg:#1a1a1a; --fg-2:#333; --fg-3:#666; --fg-4:#888;
  --line:#e5e5e5; --line-2:#d0d0d0;
  --teal:#1ba85a; --teal-2:#2BB5C8;
  --red:#dc2626; --orange:#d97706;
  --fb:'Cormorant Garamond',serif;
  --fd:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fd);font-size:13px;line-height:1.7;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--fg);background:var(--bg-3);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
label{font-size:12px;color:var(--fg-3);display:block;margin-bottom:6px}

/* ===== ログイン画面 ===== */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:48px 40px;width:100%;max-width:400px}
.login-card .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.login-card .logo img{height:28px}
.login-card .logo .label{font-family:var(--fb);font-style:italic;font-size:18px;color:var(--fg-2);line-height:1}
.login-card h1{font-size:14px;font-weight:500;color:var(--fg-3);margin-bottom:32px}
.login-card .field{margin-bottom:18px}
.login-btn{width:100%;background:var(--teal);color:var(--bg);font-weight:600;padding:12px;border-radius:4px;margin-top:12px;font-size:13px;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{background:rgba(248,113,113,.1);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:4px;font-size:12px;margin-top:14px}
.login-help{margin-top:24px;padding-top:24px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-4);line-height:1.7}

/* ===== ヘッダー ===== */
.app-nav{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:100}
.app-nav-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.app-logo{display:flex;align-items:center;gap:10px}
.app-logo img{height:28px}
.app-logo .label{font-family:var(--fb);font-style:italic;font-size:17px;color:var(--fg-2);line-height:1}
.app-meta{display:flex;align-items:center;gap:16px;font-size:12px}
.app-user{color:var(--fg-3)}
.app-user b{color:var(--fg);font-weight:500}
.app-logout{padding:6px 14px;border:1px solid var(--line-2);border-radius:4px;color:var(--fg-3);transition:all .15s;font-size:11.5px}
.app-logout:hover{border-color:var(--fg-3);color:var(--fg)}

/* ===== 記事一覧 ===== */
.app-main{max-width:1400px;margin:0 auto;padding:32px 24px 60px}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.list-head h2{font-size:20px;font-weight:600}
.list-head .h-meta{font-size:12px;color:var(--fg-3);margin-left:8px;font-weight:400}
.btn-primary{background:var(--teal);color:var(--bg);padding:10px 20px;border-radius:4px;font-weight:600;font-size:12.5px;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--bg-3);color:var(--fg-2);padding:10px 20px;border-radius:4px;font-size:12.5px;border:1px solid var(--line-2);transition:all .15s}
.btn-secondary:hover{border-color:var(--fg-3);color:var(--fg)}
.btn-danger{background:transparent;color:var(--red);padding:8px 14px;border-radius:4px;font-size:12px;border:1px solid rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.1)}

.articles-grid{display:flex;flex-direction:column;gap:14px}
.article-row{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:18px 22px;display:flex;align-items:center;gap:20px;transition:border-color .15s}
.article-row:hover{border-color:var(--line-2)}
.article-row .a-status{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:3px;flex-shrink:0;min-width:60px;text-align:center}
.a-status.live{background:rgba(121,241,164,.15);color:var(--teal)}
.a-status.draft{background:rgba(245,158,11,.15);color:var(--orange)}
.a-status.archived{background:var(--bg-3);color:var(--fg-4)}
.a-status.scheduled{background:rgba(43,181,200,.15);color:var(--teal-2)}
.article-row .a-body{flex:1;min-width:0}
.article-row .a-title{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.article-row .a-meta{font-size:11.5px;color:var(--fg-4)}
.article-row .a-cat{color:var(--teal);text-transform:uppercase;letter-spacing:.1em;font-weight:500;margin-right:10px}
.article-row .a-actions{display:flex;gap:8px;flex-shrink:0}

.empty{text-align:center;padding:80px 20px;color:var(--fg-4);font-size:13px;background:var(--bg-2);border:1px dashed var(--line-2);border-radius:8px}

/* ===== 編集画面 ===== */
.editor-wrap{display:none}
.editor-wrap.show{display:block}
.editor-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.editor-head .back{font-family:var(--fb);font-style:italic;font-size:14px;color:var(--fg-3);transition:color .15s}
.editor-head .back:hover{color:var(--fg)}
.editor-head .save-status{font-size:11px;color:var(--fg-4);margin-left:auto}

.editor-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:980px){.editor-grid{grid-template-columns:1fr}.editor-side{position:static;top:auto}}
@media(max-width:768px){
  .login-card{padding:32px 24px;border-radius:6px}
  .login-card h1{font-size:13px;margin-bottom:24px}
  .app-nav-inner{padding:12px 16px;gap:12px}
  .app-logo img{height:24px}
  .app-logo .label{font-size:15px}
  .app-meta{gap:10px;font-size:11px}
  .app-user{display:none}
  .app-logout{padding:5px 10px;font-size:11px}
  .app-main{padding:20px 16px 48px}
  .list-head{margin-bottom:20px;gap:10px}
  .list-head h2{font-size:17px}
  .btn-primary,.btn-secondary{padding:9px 16px;font-size:12px}
  .article-row{padding:14px 16px;gap:12px;flex-wrap:wrap}
  .article-row .a-status{min-width:auto;font-size:9.5px;padding:3px 8px}
  .article-row .a-title{font-size:13.5px}
  .article-row .a-meta{font-size:11px}
  .article-row .a-actions{flex:1 0 100%;margin-top:6px;justify-content:flex-end}
  .editor-head{margin-bottom:16px}
  .editor-head .back{font-size:13px}
  .editor-head .save-status{font-size:10.5px}
  .editor-grid{gap:16px}
  .editor-main input.title-input{font-size:18px;padding:12px 14px}
  .EasyMDEContainer .CodeMirror{min-height:300px;font-size:16px}
  .EasyMDEContainer .editor-toolbar{flex-wrap:wrap}
  .EasyMDEContainer .editor-toolbar button{padding:0;width:30px;height:30px}
  .editor-side{position:static!important;gap:12px}
  .side-card{padding:16px 18px}
  .side-card h3{font-size:11px;margin-bottom:10px}
  .side-card .field{margin-bottom:10px}
  .modal{padding:24px 20px;border-radius:6px;max-height:88vh}
  .modal h3{font-size:14px;margin-bottom:14px}
  .modal .field{margin-bottom:12px}
  .modal small{font-size:10.5px}
  .flash{bottom:16px;right:16px;left:16px;max-width:none;font-size:11.5px}
  input,textarea,select{font-size:16px;padding:10px 11px}
  label{font-size:11.5px}
}
@media(max-width:480px){
  .login-card{padding:24px 18px}
  .app-logo .label{font-size:13.5px}
  .article-row{padding:12px 14px}
  .editor-main input.title-input{font-size:16px}
  .EasyMDEContainer .CodeMirror{font-size:16px;min-height:240px}
}

.editor-main .field{margin-bottom:16px}
.editor-main input.title-input{font-size:22px;font-weight:600;padding:14px 16px;background:var(--bg-2)}

/* EasyMDE - default light theme */
.EasyMDEContainer{margin-top:6px}
.EasyMDEContainer .CodeMirror{min-height:400px;font-size:15px;line-height:1.8;border:1px solid #d0d0d0;border-top:none;background:#fff;color:#1a1a1a}
.EasyMDEContainer .editor-toolbar{border-radius:4px 4px 0 0;border:1px solid #d0d0d0;background:#f7f7f7}
.EasyMDEContainer .editor-toolbar button{color:#333!important}
.EasyMDEContainer .editor-toolbar button:hover,.EasyMDEContainer .editor-toolbar button.active{background:#f0f0f0;color:#000!important}
.EasyMDEContainer .editor-toolbar i.separator{border-left-color:#ddd;border-right-color:#fff}
.CodeMirror-fullscreen,.editor-preview-side,.editor-preview-active-side{z-index:200}

.editor-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.side-card{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.side-card h3{font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-weight:500}
.side-card .field{margin-bottom:12px}
.side-card .field:last-child{margin-bottom:0}
.side-card textarea{min-height:60px;resize:vertical}
.side-card .actions{display:flex;flex-direction:column;gap:8px}
.side-card .actions button{width:100%}

/* 画像挿入モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:300;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:32px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:18px}
.modal .field{margin-bottom:14px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal small{font-size:11px;color:var(--fg-4);margin-top:4px;display:block;line-height:1.6}

.flash{position:fixed;bottom:24px;right:24px;background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--teal);padding:12px 18px;border-radius:4px;font-size:12px;z-index:400;display:none;max-width:380px}
.flash.show{display:block}
.flash.error{border-left-color:var(--red);color:var(--red)}

.img-tab{flex:1;padding:8px 12px;font-size:12.5px;background:#f4f4f4;border:1px solid #d0d0d0;border-radius:3px;cursor:pointer;color:#666;font-family:inherit}
.img-tab:hover{background:#ebebeb}
.img-tab-active{background:#1ba85a!important;color:#fff!important;border-color:#1ba85a}
.img-pane{margin-top:14px}

#img-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:5000;align-items:center;justify-content:center;padding:20px}
#img-modal.modal-overlay{display:none}
#img-modal[style*="flex"]{display:flex!important}
#img-modal .modal{background:#fff;color:#1a1a1a;border-radius:6px;padding:28px 30px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#img-modal h3{margin:0 0 14px;font-size:17px;color:#1a1a1a}
#img-modal label{display:block;margin-bottom:6px;font-size:12.5px;color:#666;font-weight:500}
#img-modal input[type="text"],#img-modal input[type="url"],#img-modal input[type="file"]{width:100%;padding:10px 12px;font-size:14px;border:1px solid #d0d0d0;border-radius:3px;background:#fff;color:#1a1a1a;font-family:inherit}
#img-modal input:focus{outline:none;border-color:#1ba85a}
#img-modal .field{margin-bottom:14px}

.preview-styled{font-family:'Noto Sans JP',-apple-system,sans-serif;font-size:15px;line-height:1.95;color:#1a1a1a;padding:24px 28px!important;background:#fff!important}
.preview-styled h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;letter-spacing:.02em;line-height:1.2;margin:32px 0 16px;color:#1a1a1a}
.preview-styled h2{font-size:24px;font-weight:600;margin:36px 0 14px;color:#1a1a1a;padding-bottom:6px;border-bottom:1px solid #eee}
.preview-styled h3{font-size:18px;font-weight:600;margin:24px 0 10px;color:#333}
.preview-styled p{margin:0 0 18px;color:#333}
.preview-styled blockquote{border-left:3px solid #1ba85a;padding:6px 0 6px 16px;margin:20px 0;color:#555;font-style:italic;background:#fafafa}
.preview-styled ul,.preview-styled ol{margin:0 0 18px 24px;color:#333}
.preview-styled li{margin-bottom:6px}
.preview-styled code{background:#f4f4f4;padding:2px 6px;border-radius:3px;font-size:13px;color:#c026d3}
.preview-styled pre{background:#1a1a1a;color:#f0f0f0;padding:14px 18px;border-radius:4px;overflow-x:auto;margin:18px 0}
.preview-styled pre code{background:transparent;color:inherit;padding:0}
.preview-styled img{max-width:100%;height:auto;display:block;margin:24px auto;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.preview-styled a{color:#2BB5C8;border-bottom:1px solid #2BB5C8}
.preview-styled hr{border:none;border-top:1px solid #ddd;margin:28px 0}
.editor-preview-side{background:#fff!important;color:#1a1a1a!important;border-left:1px solid #d0d0d0}
</style>
</head>
<body>

<!-- ============== ログイン画面 ============== -->
<section class="login-screen" id="screen-login">
  <div class="login-card">
    <div class="logo">
      <img src="/shared/coworkmill-logo.svg" alt="COWORKMILL">
      <span class="label">journal</span>
    </div>
    <h1>運営ログイン</h1>
    <form id="login-form">
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-submit">ログイン</button>
      <div class="login-error" id="login-error" style="display:none"></div>
    </form>
    <div class="login-help">
      Lily Partners 運営者専用ページです。<br>
      Supabase Auth に登録したメールでログインしてください。
    </div>
  </div>
</section>

<!-- ============== アプリ本体(ログイン後) ============== -->
<header class="app-nav" id="screen-app-nav" style="display:none">
  <div class="app-nav-inner">
    <a href="/journal/" class="app-logo">
      <img src="/shared/coworkmill-logo.svg" alt="COWORKMILL">
      <span class="label">journal</span>
    </a>
    <div class="app-meta">
      <span class="app-user"><b id="user-name">—</b> としてログイン中</span>
      <button class="app-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
</header>

<main class="app-main" id="screen-app" style="display:none">

  <!-- 記事一覧 -->
  <section id="view-list">
    <div class="list-head">
      <h2>ジャーナル記事 <span class="h-meta" id="list-count"></span></h2>
      <button class="btn-primary" onclick="newArticle()">+ 新しい記事を書く</button>
    </div>
    <div id="articles-area"><div class="empty">読み込み中...</div></div>
  </section>

  <!-- 編集画面 -->
  <section class="editor-wrap" id="view-editor">
    <div class="editor-head">
      <a href="#" class="back" onclick="backToList();return false">← 一覧に戻る</a>
      <span class="save-status" id="save-status"></span>
    </div>
    <div class="editor-grid">
      <div class="editor-main">
        <div class="field">
          <input type="text" class="title-input" id="ed-title" placeholder="記事タイトル(1〜200文字)" maxlength="200">
        </div>
        <div class="field">
          <input type="text" id="ed-subtitle" placeholder="サブタイトル(任意・300文字以内)" maxlength="300">
        </div>
        <div class="field">
          <textarea id="ed-body" placeholder="本文(Markdown 対応)"></textarea>
        </div>
      </div>

      <aside class="editor-side">
        <div class="side-card">
          <h3>公開設定</h3>
          <div class="field">
            <label>ステータス</label>
            <select id="ed-status">
              <option value="draft">下書き</option>
              <option value="live">公開</option>
              <option value="archived">アーカイブ</option>
            </select>
          </div>
          <div class="field">
            <label>カテゴリ</label>
            <select id="ed-category">
              <option value="interview">インタビュー</option>
              <option value="trend">トレンド</option>
              <option value="news">ニュース</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="field">
            <label>スラッグ(URL)</label>
            <input type="text" id="ed-slug" placeholder="my-article" pattern="[a-z0-9-]+" maxlength="100">
            <small style="color:var(--fg-4);font-size:11px;margin-top:4px;display:block">英小文字・数字・ハイフンのみ</small>
          </div>
          <div class="actions">
            <button class="btn-primary" onclick="saveArticle()">保存</button>
            <button class="btn-secondary" onclick="previewArticle()">プレビュー</button>
            <button class="btn-danger" id="btn-delete" onclick="deleteArticle()" style="display:none">記事を削除</button>
          </div>
        </div>

        <div class="side-card">
          <h3>記事メタ情報</h3>
          <div class="field">
            <label>抜粋(500文字以内)</label>
            <textarea id="ed-excerpt" maxlength="500" placeholder="記事カードに表示される一文"></textarea>
          </div>
          <div class="field">
            <label>タグ(カンマ区切り)</label>
            <input type="text" id="ed-tags" placeholder="渋谷, 取材, 内装">
          </div>
          <div class="field">
            <label>ヒーロー画像 URL</label>
            <input type="text" id="ed-hero" placeholder="https://...">
          </div>
          <div class="field">
            <label>読了時間(分)</label>
            <input type="number" id="ed-reading" min="1" max="120" placeholder="3">
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>

<!-- 画像挿入モーダル -->
<div class="modal-overlay" id="img-modal" style="display:none">
  <div class="modal">
    <h3>画像を挿入</h3>
    <p style="font-size:12.5px;color:#666;margin-bottom:14px">挿入したい画像をアップロードするか、URL を貼り付けてください。</p>
    
    <div class="field">
      <label>方法を選択</label>
      <div style="display:flex;gap:6px">
        <button type="button" id="img-tab-upload" class="img-tab img-tab-active" onclick="switchImgTab('upload')">アップロード</button>
        <button type="button" id="img-tab-url" class="img-tab" onclick="switchImgTab('url')">URLを指定</button>
      </div>
    </div>
    
    <div id="img-pane-upload" class="img-pane">
      <div class="field">
        <label for="img-file">画像ファイル</label>
        <input type="file" id="img-file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
        <small style="color:#666;font-size:11.5px">JPG / PNG / WebP / GIF / SVG・10MB まで</small>
      </div>
    </div>
    
    <div id="img-pane-url" class="img-pane" style="display:none">
      <div class="field">
        <label for="img-url">画像URL</label>
        <input type="url" id="img-url" placeholder="https://example.com/photo.jpg">
      </div>
    </div>
    
    <div class="field">
      <label for="img-alt">代替テキスト(alt)</label>
      <input type="text" id="img-alt" placeholder="例:〇〇コワーキングのラウンジ" maxlength="200">
      <small style="color:#666;font-size:11.5px">画像が表示されない時に出る説明文。アクセシビリティ・SEO 上重要です。</small>
    </div>
    
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">

function slugify(t){
  return (t||'').toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0, 100);
}

async function checkSlugAvailable(slug, excludeId){
  // 自分以外で同じ slug を持つ記事がないか確認(全 status 対象、live じゃなくても重複は禁止)
  let url = SUPABASE_URL + '/rest/v1/articles?select=id,status&slug=eq.' + encodeURIComponent(slug) + '&limit=1';
  // 自分の記事は anon SELECT は status=live 以外見えない、authenticated は自分のだけ。
  // ここでは authenticated として fetch すれば自分のは見える、他人のは live のみ。
  // つまり「他人の draft とぶつかる」ケースは検知できない、ただし RLS の writer_insert は author_user_id=auth.uid() を要求するので
  // 他人の slug と被ったときは 409(unique constraint)が DB から返ってくる、それでフォロー。
  const r = await fetch(url, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + session.access_token }
  });
  const data = await r.json();
  if (Array.isArray(data) && data[0] && data[0].id !== excludeId) return false;
  return true;
}

async function saveArticle(){
  const slugInput = document.getElementById('ed-slug').value.trim();
  let slug = slugInput;
  if (!slug) {
    slug = slugify(document.getElementById('ed-title').value);
    if (!slug) slug = 'article-' + Date.now();
    document.getElementById('ed-slug').value = slug;
  }
  if (!/^[a-z0-9-]{1,100}$/.test(slug)) {
    flash('スラッグは英小文字・数字・ハイフンのみ・1〜100文字です', true); return;
  }
  
  const titleVal = document.getElementById('ed-title').value.trim();
  if (!titleVal) {
    flash('タイトルを入力してください', true); return;
  }
  if (titleVal.length > 200) {
    flash('タイトルは200文字以内です', true); return;
  }
  
  const subtitle = document.getElementById('ed-subtitle').value.trim();
  if (subtitle.length > 300) {
    flash('サブタイトルは300文字以内です', true); return;
  }
  
  const tags = document.getElementById('ed-tags').value.split(',').map(s=>s.trim()).filter(s=>s);
  if (tags.length > 20) {
    flash('タグは20個までです', true); return;
  }
  if (tags.some(t => t.length > 50)) {
    flash('各タグは50文字以内にしてください', true); return;
  }
  
  const excerpt = document.getElementById('ed-excerpt').value.trim();
  if (excerpt.length > 500) {
    flash('抜粋は500文字以内です', true); return;
  }
  
  const reading = parseInt(document.getElementById('ed-reading').value) || null;
  if (reading !== null && (reading < 1 || reading > 120)) {
    flash('読了時間は1〜120分の範囲です', true); return;
  }
  
  const bodyMd = mde.value();
  if (bodyMd.length > 100000) {
    flash('本文は100,000文字以内です', true); return;
  }
  
  const status = document.getElementById('ed-status').value;
  
  // 公開時の確認
  if (status === 'live' && currentArticle.status !== 'live') {
    if (!confirm('この記事を「公開」状態にして全ユーザーが閲覧できるようにします。よろしいですか?')) {
      return;
    }
  }
  
  // slug 重複チェック(自分の記事を除く)
  const slugOk = await checkSlugAvailable(slug, currentArticle.id);
  if (!slugOk) {
    flash('このスラッグはすでに使われています。別のものを指定してください。', true); return;
  }
  
  const payload = {
    slug,
    title: titleVal,
    subtitle: subtitle || null,
    category: document.getElementById('ed-category').value,
    status,
    body_md: bodyMd,
    excerpt: excerpt || null,
    tags: tags.length ? tags : null,
    hero_image: document.getElementById('ed-hero').value.trim() || null,
    reading_minutes: reading,
    author_user_id: session.user.id,
    author_name: writerProfile.display_name
  };
  if (payload.status === 'live' && !currentArticle.published_at) {
    payload.published_at = new Date().toISOString();
  }
  
  document.getElementById('save-status').textContent = '保存中...';
  
  try {
    let r;
    if (currentArticle.id) {
      r = await fetch(SUPABASE_URL + '/rest/v1/articles?id=eq.' + currentArticle.id, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });
    } else {
      r = await fetch(SUPABASE_URL + '/rest/v1/articles', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });
    }
    const data = await r.json();
    if (!r.ok) {
      let msg = (Array.isArray(data) ? data[0] : data)?.message || '保存に失敗しました';
      // unique violation を判別
      if (msg.indexOf('duplicate key') > -1 || msg.indexOf('unique') > -1) {
        msg = 'このスラッグはすでに使われています。別のものを指定してください。';
      }
      flash(msg, true);
      document.getElementById('save-status').textContent = '';
      return;
    }
    currentArticle = Array.isArray(data) ? data[0] : data;
    document.getElementById('btn-delete').style.display = 'block';
    document.getElementById('save-status').textContent = '保存しました ' + new Date().toLocaleTimeString('ja-JP');
    isDirty = false;
    flash('保存しました');
  } catch (e) {
    console.error(e);
    flash('エラー: ' + e.message, true);
  }
}

async function uploadFileToStorage(file){
  if (!currentArticle?.id) throw new Error('画像アップロードには先に記事を保存してください');
  if (file.size > 10 * 1024 * 1024) throw new Error('ファイルサイズは10MB以下にしてください');
  
  // パス: {user_id}/{article_id}/{timestamp}-{filename}
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_').substring(0, 100);
  const path = session.user.id + '/' + currentArticle.id + '/' + Date.now() + '-' + safeName;
  
  const progressEl = document.getElementById('img-upload-progress');
  progressEl.style.display = 'block';
  progressEl.textContent = 'アップロード中...';
  
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/journal-images/' + path, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': file.type,
      'x-upsert': 'true'
    },
    body: file
  });
  
  if (!r.ok) {
    const err = await r.text();
    progressEl.style.display = 'none';
    throw new Error('アップロード失敗: ' + err.substring(0, 200));
  }
  
  const publicUrl = SUPABASE_URL + '/storage/v1/object/public/journal-images/' + path;
  progressEl.textContent = 'アップロード完了';
  setTimeout(() => { progressEl.style.display = 'none'; }, 2000);
  return publicUrl;
}

async function insertImage(){
  const altInput = document.getElementById('img-alt');
  const alt = (altInput?.value || '').trim();
  if (!alt) { flash('代替テキスト(alt)を入力してください', true); altInput?.focus(); return; }
  
  const isUrlTab = document.getElementById('img-pane-url').style.display !== 'none';
  let imageUrl = null;
  
  const insertBtn = document.getElementById('img-insert-btn');
  insertBtn.disabled = true;
  insertBtn.textContent = '処理中...';
  
  try {
    if (isUrlTab) {
      const urlIn = document.getElementById('img-url');
      const u = (urlIn?.value || '').trim();
      if (!u) { flash('画像URLを入力してください', true); urlIn?.focus(); return; }
      try { new URL(u); } catch(e) { flash('有効なURLを入力してください', true); return; }
      imageUrl = u;
    } else {
      const fileIn = document.getElementById('img-file');
      const f = fileIn?.files?.[0];
      if (!f) { flash('画像ファイルを選択してください', true); return; }
      if (f.size > 10 * 1024 * 1024) { flash('ファイルサイズは10MB以下にしてください', true); return; }
      
      const session = JSON.parse(localStorage.getItem('sb-jakwntemjkwqwaqujffh-auth-token') || 'null');
      if (!session?.access_token) { flash('セッションが無効です。ログインし直してください', true); return; }
      const userId = session.user.id;
      const articleId = currentArticle.id || 'untitled';
      const ts = Date.now();
      const safeName = f.name.replace(/[^\w.-]/g, '_');
      const path = userId + '/' + articleId + '/' + ts + '-' + safeName;
      
      const upRes = await fetch(SUPABASE_URL + '/storage/v1/object/journal-images/' + path, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + session.access_token,
          'Content-Type': f.type
        },
        body: f
      });
      if (!upRes.ok) {
        const err = await upRes.json().catch(() => ({}));
        flash('アップロード失敗: ' + (err.message || upRes.status), true);
        return;
      }
      imageUrl = SUPABASE_URL + '/storage/v1/object/public/journal-images/' + path;
    }
    
    // markdown 挿入
    const md = '![' + alt.replace(/[\[\]]/g, '') + '](' + imageUrl + ')';
    if (typeof mde !== 'undefined' && mde) {
      const cm = mde.codemirror;
      cm.replaceSelection(md);
      cm.focus();
    }
    isDirty = true;
    closeImgModal();
    flash('画像を挿入しました', false);
  } catch (e) {
    console.error(e);
    flash('エラー: ' + (e.message || e), true);
  } finally {
    insertBtn.disabled = false;
    insertBtn.textContent = '挿入';
  }
}

let _flashTimer = null;
function flash(msg, isError){
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash show' + (isError ? ' error' : '');
  if (_flashTimer) clearTimeout(_flashTimer);
  // エラーは長め(7秒)に表示、成功は3.5秒
  _flashTimer = setTimeout(() => el.classList.remove('show'), isError ? 7000 : 3500);
}

  renderList(list);
}

async function bootstrap(){
  session = getSession();
  if (!session?.access_token) {
    showLoginScreen();
    return;
  }
  // セッション期限チェック
  if (session.expires_at && Date.now() / 1000 > session.expires_at - 60) {
    setSession(null);
    showLoginScreen();
    return;
  }
  try {
    await loadWriterProfile();
    showApp();
  } catch (e) {
    setSession(null);
    showLoginScreen(e.message);
  }
}

  document.getElementById('screen-app-nav').style.display = 'none';
  document.getElementById('screen-app').style.display = 'none';
  if (errMsg) {
    const e = document.getElementById('login-error');
    e.textContent = errMsg; e.style.display = 'block';
  }
}

function showApp(){
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app-nav').style.display = 'block';
  document.getElementById('screen-app').style.display = 'block';
  document.getElementById('user-name').textContent = writerProfile.display_name;
  refresh();
}

  } catch (err) {
    let msg = err.message || 'ログインに失敗しました';
    if (msg.toLowerCase().indexOf('invalid login credentials') > -1) {
      msg = 'メールアドレスまたはパスワードが間違っています';
    } else if (msg.toLowerCase().indexOf('email not confirmed') > -1) {
      msg = 'メールアドレスが確認されていません。編集部にお問い合わせください。';
    }
    errEl.textContent = msg;
    errEl.style.display = 'block';
    btn.textContent = 'ログイン';
    btn.disabled = false;
  }
});

bootstrap();

function switchImgTab(which){
  const upTab = document.getElementById('img-tab-upload');
  const urlTab = document.getElementById('img-tab-url');
  const upPane = document.getElementById('img-pane-upload');
  const urlPane = document.getElementById('img-pane-url');
  if (which === 'upload') {
    upTab.classList.add('img-tab-active'); urlTab.classList.remove('img-tab-active');
    upPane.style.display = ''; urlPane.style.display = 'none';
  } else {
    urlTab.classList.add('img-tab-active'); upTab.classList.remove('img-tab-active');
    urlPane.style.display = ''; upPane.style.display = 'none';
  }
}
function closeImgModal(){
  const m = document.getElementById('img-modal');
  if (m) m.style.display = 'none';
  document.getElementById('img-file').value = '';
  document.getElementById('img-url').value = '';
  document.getElementById('img-alt').value = '';
  switchImgTab('upload');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const m = document.getElementById('img-modal');
    if (m && m.style.display !== 'none' && m.style.display !== '') {
      if (typeof closeImgModal === 'function') closeImgModal();
    }
  }
});
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'img-modal') {
    if (typeof closeImgModal === 'function') closeImgModal();
  }
});
</script>
</body>
