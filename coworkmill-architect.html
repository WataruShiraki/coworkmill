<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>建築家 — COWORKMILL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0e0e0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
a{color:inherit;text-decoration:none;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#0e0e0e;border-bottom:1px solid #1e1e1e;position:sticky;top:0;z-index:100;}
.nav-logo img{height:24px;width:auto;}
.nav-links{display:flex;gap:28px;font-size:13px;color:#888;align-items:center;}
.nav-links a:hover{color:#fff;}
.nav-cta{background:#2BB5C8;color:#000!important;padding:8px 18px;border-radius:4px;font-size:13px;font-weight:700;}
.hero{max-width:900px;margin:0 auto;padding:56px 40px 40px;}
.hero-inner{display:flex;gap:36px;align-items:flex-start;}
.portrait-img{width:160px;height:160px;border-radius:10px;object-fit:cover;object-position:top center;display:block;background:#1e1e1e;flex-shrink:0;}
.hero-info{flex:1;}
.label{font-size:10px;letter-spacing:.2em;color:#2BB5C8;text-transform:uppercase;margin-bottom:10px;}
.name-ja{font-size:14px;color:#888;margin-bottom:6px;}
.name-en{font-size:30px;font-weight:800;line-height:1.2;margin-bottom:18px;}
.bio{font-size:14px;line-height:1.9;color:#aaa;margin-bottom:26px;max-width:560px;}
.contact-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid #2BB5C8;color:#2BB5C8;padding:10px 22px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.contact-btn:hover{background:#2BB5C8;color:#000;}
.works{max-width:900px;margin:0 auto;padding:0 40px 80px;}
.works-head{font-size:10px;letter-spacing:.2em;color:#444;text-transform:uppercase;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid #1e1e1e;}
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.space-card{display:block;background:#141414;border-radius:10px;overflow:hidden;border:1px solid #1e1e1e;transition:border-color .2s;}
.space-card:hover{border-color:#2BB5C8;}
.space-card-img{width:100%;height:170px;object-fit:cover;display:block;background:#1a1a1a;}
.space-card-body{padding:14px 16px;}
.space-card-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.space-card-area{font-size:12px;color:#555;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#161616;border:1px solid #2a2a2a;border-radius:12px;width:100%;max-width:480px;padding:32px;margin:16px;}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px;}
.modal label{display:block;font-size:12px;color:#777;margin-bottom:5px;margin-top:14px;}
.modal input,.modal textarea,.modal select{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;color:#fff;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;}
.modal textarea{height:110px;resize:vertical;}
.modal input:focus,.modal textarea:focus{border-color:#2BB5C8;}
.modal-btns{display:flex;gap:10px;margin-top:22px;}
.btn-send{flex:1;background:#2BB5C8;color:#000;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-x{background:transparent;border:1px solid #333;color:#888;border-radius:6px;padding:11px 18px;font-size:14px;cursor:pointer;}
.btn-x:hover{color:#fff;}
.ok{display:none;text-align:center;padding:20px 0;}
.ok .ck{font-size:36px;color:#2BB5C8;margin-bottom:12px;}
.err{color:#e55;font-size:12px;margin-top:6px;display:none;}
.msg{text-align:center;padding:80px 40px;color:#444;font-size:14px;}
</style>
</head>
<body>
<nav class="nav">
<a href="coworkmill.html"><img src="coworkmill_logo2.svg" alt="COWORKMILL" style="height:24px"></a>
<div class="nav-links">
<a href="coworkmill-spaces.html">コワーキングを探す</a>
<a href="coworkmill-architects.html">建築家から探す</a>
<a href="coworkmill-photos.html">写真から探す</a>
<a href="coworkmill-register.html" class="nav-cta">コワーキング登録</a>
</div>
</nav>
<div id="root"><div class="msg">読み込み中…</div></div>
<div class="modal-bg" id="mbg">
<div class="modal">
<div id="mf">
<h2 id="mt"></h2>
<label>お名前 *</label><input type="text" id="cn">
<label>メール *</label><input type="email" id="ce">
<label>種類</label><select id="ck"><option>設計相談</option><option>施工相談</option><option>コワーキング設計</option><option>その他</option></select>
<label>内容 *</label><textarea id="cb"></textarea>
<p class="err" id="er">必須項目を入力してください</p>
<div class="modal-btns"><button class="btn-x" id="mc">キャンセル</button><button class="btn-send" id="ms">送信</button></div>
</div>
<div class="ok" id="ok"><div class="ck">✓</div><p>送信しました。</p><button class="btn-x" id="mcl" style="margin-top:16px;width:100%">閉じる</button></div>
</div>
</div>
<script>
(function(){
var S="https://jakwntemjkwqwaqujffh.supabase.co",K="sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ";
var id=new URLSearchParams(location.search).get("id");
var mbg=document.getElementById("mbg");
function hide(){mbg.classList.remove("open");}
document.getElementById("mc").onclick=hide;
document.getElementById("mcl").onclick=function(){hide();document.getElementById("ok").style.display="none";document.getElementById("mf").style.display="block";};
document.getElementById("ms").onclick=async function(){
var n=document.getElementById("cn").value.trim(),e=document.getElementById("ce").value.trim(),b=document.getElementById("cb").value.trim(),t=document.getElementById("ck").value;
if(!n||!e||!b){document.getElementById("er").style.display="block";return;}
document.getElementById("er").style.display="none";
try{await fetch("https://formspree.io/f/xzzpjywb",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name:n,email:e,_replyto:e,_subject:"[COWORKMILL] "+t,message:document.getElementById("mt").textContent+"\n"+t+"\n"+n+"\n"+e+"\n"+b})});}catch(x){}
document.getElementById("mf").style.display="none";document.getElementById("ok").style.display="block";};
if(!id){document.getElementById("root").innerHTML='<div class="msg">建築家が見つかりません</div>';return;}
async function go(){
try{
var r=await fetch(S+"/rest/v1/architects?select=*&id=eq."+id,{headers:{"apikey":K,"Authorization":"Bearer "+K}});
var a=(await r.json())[0];
if(!a){document.getElementById("root").innerHTML='<div class="msg">建築家が見つかりません</div>';return;}
document.title=(a.name_en||a.name)+"が手がけたコワーキングスペース — COWORKMILL";
document.getElementById("mt").textContent=(a.name_en||a.name)+"にお問い合わせ";
var sr=await fetch(S+"/rest/v1/spaces?select=id,name,area&architect_id=eq."+id+"&status=eq.live",{headers:{"apikey":K,"Authorization":"Bearer "+K}});
var sp=await sr.json();
var cards="";
if(Array.isArray(sp)&&sp.length){for(var i=0;i<sp.length;i++){var s=sp[i],ph="";
try{var lr=await fetch(S+"/storage/v1/object/list/space-images",{method:"POST",headers:{"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({prefix:s.id+"/",limit:1})});var fs=await lr.json();if(Array.isArray(fs)&&fs.length)ph=S+"/storage/v1/object/public/space-images/"+s.id+"/"+fs[0].name;}catch(e2){}
cards+='<a href="coworkmill-detail.html?id='+s.id+'" class="space-card">'+(ph?'<img class="space-card-img" src="'+ph+'" loading="lazy">':'<div class="space-card-img"></div>')+'<div class="space-card-body"><div class="space-card-name">'+s.name+'</div><div class="space-card-area">'+s.area+'</div></div></a>';}}
var nameJa=(a.firm&&a.firm!==a.name_en)?a.firm:(a.name||"");
document.getElementById("root").innerHTML='<div class="hero"><div class="hero-inner">'+(a.portrait_url?'<img class="portrait-img" src="'+a.portrait_url+'" alt="'+a.name_en+'">':"")+'<div class="hero-info"><div class="label">Architect</div>'+(nameJa?'<div class="name-ja">'+nameJa+"</div>":"")+'<div class="name-en">'+a.name_en+'</div>'+(a.bio?'<div class="bio">'+a.bio+"</div>":"")+'<button class="contact-btn" id="cb">✉️ '+a.name_en+'にお問い合わせ</button></div></div></div>'+(Array.isArray(sp)&&sp.length?'<div class="works"><div class="works-head">手がけたコワーキングスペース — '+sp.length+' 件</div><div class="works-grid">'+cards+"</div></div>":"");
document.getElementById("cb").onclick=function(){mbg.classList.add("open");};
}catch(e){document.getElementById("root").innerHTML='<div class="msg">エラー: '+e.message+'</div>';}
}
go();
})();
</script>
</body>
</html>
