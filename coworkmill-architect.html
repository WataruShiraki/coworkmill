<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>建築家 — COWORKMILL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
a{color:inherit;text-decoration:none;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;background:rgba(0,0,0,.9);position:sticky;top:0;z-index:100;border-bottom:1px solid #222;}
.nav-logo{font-weight:800;font-size:16px;letter-spacing:.05em;}
.nav-links{display:flex;gap:24px;font-size:13px;color:#aaa;}
.nav-links a:hover{color:#fff;}
.nav-cta{background:#2BB5C8;color:#fff!important;padding:8px 16px;border-radius:4px;font-size:13px;font-weight:600;}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;color:#666;font-size:14px;}
.arch-hero{padding:60px 32px 40px;max-width:900px;margin:0 auto;display:flex;gap:32px;align-items:flex-start;}
.arch-portrait{width:120px;height:120px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#222;}
.arch-info{flex:1;}
.arch-label{font-size:10px;letter-spacing:.2em;color:#2BB5C8;margin-bottom:12px;text-transform:uppercase;}
.arch-name-ja{font-size:14px;color:#888;margin-bottom:6px;}
.arch-name-en{font-size:28px;font-weight:700;margin-bottom:8px;}
.arch-firm{font-size:13px;color:#888;margin-bottom:16px;}
.arch-bio{font-size:14px;line-height:1.8;color:#ccc;}
.arch-works{max-width:900px;margin:0 auto;padding:0 32px 60px;}
.arch-works-title{font-size:11px;letter-spacing:.15em;color:#666;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #222;}
.arch-works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.space-card{display:block;background:#1a1a1a;border-radius:8px;overflow:hidden;transition:opacity .2s;}
.space-card:hover{opacity:.85;}
.space-card img{width:100%;height:180px;object-fit:cover;display:block;background:#111;}
.space-card-info{padding:14px 16px;}
.space-card-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.space-card-area{font-size:12px;color:#888;}
.error-msg{text-align:center;padding:80px 32px;color:#666;}
.footer{text-align:center;padding:32px;font-size:12px;color:#444;border-top:1px solid #1a1a1a;}
</style>
</head>
<body>
<nav class="nav">
  <a href="coworkmill.html" class="nav-logo">COWORKMILL</a>
  <div class="nav-links">
    <a href="coworkmill-spaces.html">コワーキングを探す</a>
    <a href="coworkmill-architects.html">建築家から探す</a>
    <a href="coworkmill-photos.html">写真から探す</a>
  </div>
  <a href="coworkmill-register.html" class="nav-cta nav-links">コワーキング登録</a>
</nav>
<div id="main"><div class="loading">読み込み中...</div></div>
<footer class="footer">© COWORKMILL</footer>
<script>
(function(){
var S="https://jakwntemjkwqwaqujffh.supabase.co",K="sb_publishable_bQ84WCmRiFUbpPemMcO9xQ_Dj9Mh1mQ";
var id=new URLSearchParams(location.search).get("id");
if(!id){document.getElementById("main").innerHTML='<div class="error-msg">建築家が見つかりません</div>';return;}
async function load(){
try{
var ar=await fetch(S+"/rest/v1/architects?select=*&id=eq."+id,{headers:{"apikey":K,"Authorization":"Bearer "+K}});
var archs=await ar.json();
var a=archs[0];
if(!a){document.getElementById("main").innerHTML='<div class="error-msg">建築家が見つかりません</div>';return;}
document.title=(a.name_en||a.name)+"が手がけたコワーキングスペース — COWORKMILL";
var sr=await fetch(S+"/rest/v1/spaces?select=id,name,area&architect_id=eq."+id+"&status=eq.live",{headers:{"apikey":K,"Authorization":"Bearer "+K}});
var spaces=await sr.json();
var spaceCards="";
if(Array.isArray(spaces)){for(var i=0;i<spaces.length;i++){var sp=spaces[i];var photoUrl="";
try{var lr=await fetch(S+"/storage/v1/object/list/space-images",{method:"POST",headers:{"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({prefix:sp.id+"/",limit:1})});var files=await lr.json();if(Array.isArray(files)&&files.length)photoUrl=S+"/storage/v1/object/public/space-images/"+sp.id+"/"+files[0].name;}catch(e){}
spaceCards+='<a href="coworkmill-detail.html?id='+sp.id+'" class="space-card">'+(photoUrl?'<img src="'+photoUrl+'" alt="'+sp.name+'" loading="lazy">':"<div style=\"height:180px;background:#111\"></div>")+'<div class="space-card-info"><div class="space-card-name">'+sp.name+'</div><div class="space-card-area">'+sp.area+'</div></div></a>';}}
var worksSection=spaces&&spaces.length?'<div class="arch-works"><div class="arch-works-title">手がけたコワーキングスペース — '+spaces.length+' 件</div><div class="arch-works-grid">'+spaceCards+"</div></div>":"";
var html='<div class="arch-hero">'+(a.portrait_url?'<img class="arch-portrait" src="'+a.portrait_url+'" alt="'+a.name_en+'">':"")+"<div class=\"arch-info\"><div class=\"arch-label\">Architect</div><div class=\"arch-name-ja\">"+a.name+"</div><div class=\"arch-name-en\">"+a.name_en+"</div><div class=\"arch-firm\">"+a.firm+"</div><div class=\"arch-bio\">"+a.bio+"</div></div></div>"+worksSection;
document.getElementById("main").innerHTML=html;
}catch(e){document.getElementById("main").innerHTML='<div class="error-msg">エラー: '+e.message+'</div>';}
}
load();
})();
</script>
</body>
</html>
